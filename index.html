<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f6a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Paiements">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Suivi des paiements</title>
<style>
:root{
  /* Jetons repris de CR-1clic, pour que les outils du cabinet se ressemblent.
     Mise en page : en-tête fixe avec les quatre écrans ; sur chaque écran, l'action ou le résumé d'abord, le détail ensuite. */
  --bg:#f6f5f2; --card:#fff; --ink:#1f2328; --muted:#646b73; --line:#e3e1dc;
  --accent:#2f6f6a; --accent-soft:#e3f0ee; --on-accent:#fff;
  --warn:#9a5b00; --warn-soft:#fdf1dc; --bad:#a33a2b; --bad-soft:#fbe9e6;
  --vert:#2e7a3a; --vert-soft:#e3f3e5; --jaune:#7a5c00; --jaune-bord:#d4a514; --jaune-soft:#fff4c7;
  --paper:#fff; --paper-ink:#1a1a1a; --radius:14px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  /* graphiques : quatre teintes validées (daltonisme, contraste), dans un ordre fixe */
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --bg:#16181b; --card:#1f2226; --ink:#e8e6e1; --muted:#9aa0a6; --line:#33373c;
    --accent:#6bb5ad; --accent-soft:#1f3735; --on-accent:#0f1f1e;
    --warn:#e0a54a; --warn-soft:#3a2d17; --bad:#ef8f80; --bad-soft:#3b2220; --vert:#7fcf8b; --vert-soft:#1d3322; --jaune:#f0cd5a; --jaune-bord:#c9a02a; --jaune-soft:#3a3214;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#16181b; --card:#1f2226; --ink:#e8e6e1; --muted:#9aa0a6; --line:#33373c;
  --accent:#6bb5ad; --accent-soft:#1f3735; --on-accent:#0f1f1e;
  --warn:#e0a54a; --warn-soft:#3a2d17; --bad:#ef8f80; --bad-soft:#3b2220; --vert:#7fcf8b; --vert-soft:#1d3322; --jaune:#f0cd5a; --jaune-bord:#c9a02a; --jaune-soft:#3a3214;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* en-tête et écrans */
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:650;white-space:nowrap}
header h1 button{border:0;background:none;padding:0;font-weight:inherit;cursor:pointer}
.sp{flex:1}
.btn-notes{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.btn-notes:hover,.btn-notes.on{border-color:var(--accent);background:var(--accent-soft)}
.btn-notes svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.compte-notes{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.compte-notes[hidden]{display:none}
.titre-carte{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;margin-bottom:6px}
.titre-carte h3{margin:0}
.note-carte{border-top:1px solid var(--line);padding:12px 0 6px}
.note-carte:first-of-type{border-top:0}
.note-carte.faite .note-texte{color:var(--muted)}
.note-tete{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.note-texte{margin:8px 0 4px;white-space:normal;line-height:1.45}
table.t.suite{margin-top:12px}
.badge{font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:3px 10px;white-space:nowrap}
.onglets{display:flex;gap:2px;flex-wrap:wrap;font-size:15px}
.onglets button{border:0;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--muted)}
.onglets button:hover{color:var(--ink)}
.onglets button.on{background:var(--accent-soft);color:var(--ink);font-weight:600}

main{padding:20px 20px 100px;max-width:1240px;margin:0 auto}
main.vue-encaissements{max-width:1560px}
.t.livre th,.t.livre td{padding-left:8px;padding-right:8px}
.t.livre td:first-child,.t.livre th:first-child .th-btn{padding-left:14px}
.t.livre .th-btn{padding:10px 8px;gap:4px}
.t.livre td.act{padding-right:12px}
.t.livre td.act .btn{margin-left:3px;padding:4px 9px}
.t.livre td.act .btn.link{padding-left:4px;padding-right:2px}
.t.livre td.nom{white-space:normal;min-width:110px}
.t.livre td.presta{min-width:120px}
@media (max-width:1260px){
  .t.livre td.act{white-space:normal;width:1%;min-width:166px}
  .t.livre td:nth-child(8){min-width:0}
  .t.livre .sous-pill{white-space:normal}
  .t.livre td:nth-child(8) .pill{white-space:normal;text-align:center}
  .t.livre td.act .btn{margin:2px 0 2px 3px}
  .t.livre td.act .btn.link{display:inline-block}
  .t.livre td:nth-child(9){white-space:normal;min-width:90px}
}
h2{margin:0;font-size:22px;text-wrap:balance}
h3{margin:0 0 10px;font-size:16px}
h3.suite{margin-top:20px}
.lead{color:var(--muted);margin:2px 0 0}
.fil{margin:0 0 2px;font-size:13px}
.titre{display:flex;gap:12px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.fin{justify-content:flex-end;margin-top:14px}
.col{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}
.avis{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:9px 14px;font-size:14px;margin:0 0 14px}
.avis.suite{margin:14px 0 10px}
section + section,.bloc{margin-top:14px}
.bloc > h3{margin:22px 0 8px}
.colonnes{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.colonnes > *{min-width:0}
.colonnes > section{margin-top:0}

/* boutons et champs */
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 16px;min-height:40px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 11px;min-height:32px;font-weight:500;font-size:14px;border-radius:10px}
.btn.link{border:0;background:none;color:var(--accent);padding:4px 2px;min-height:0;text-decoration:underline;font-weight:500}
.btn.danger{color:var(--bad)}
/* bouton « Déposer en banque » et bandeau de rappel : vert jusqu'à 400 €, jaune jusqu'à 800 €, rouge au-delà */
.btn.depot.vert,.rappel.vert{background:var(--vert-soft);border-color:var(--vert);color:var(--vert)}
.btn.depot.jaune,.rappel.jaune{background:var(--jaune-soft);border-color:var(--jaune-bord);color:var(--jaune)}
.btn.depot.rouge,.rappel.rouge{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.depot.vert,.btn.depot.jaune,.btn.depot.rouge{font-weight:700;border-width:1.5px}
.btn.depot.vert:hover,.btn.depot.jaune:hover,.btn.depot.rouge:hover{filter:brightness(.97)}
.rappel{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;border:1.5px solid;border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:14.5px}
.rappel .txt{flex:1 1 320px}
.rappel .txt b{margin-right:4px}
.rappel .btn.link{color:inherit}
.sous-pill{display:block;font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap}
label.coche{display:flex;align-items:center;gap:12px;cursor:pointer;flex:1 1 auto}
textarea.haut{min-height:170px}
.btn:disabled{opacity:.4;cursor:default;border-color:var(--line)}
input[type=text],input[type=search],input[type=date],input[type=number],input[type=email],input:not([type]),select,textarea{border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--card);min-height:36px;max-width:100%}
input:disabled,select:disabled{opacity:.6;background:var(--bg)}
input.autre-jour{border-color:var(--warn);background:var(--warn-soft)}
textarea{min-height:70px;resize:vertical}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:16px;height:16px;flex:none}
.champs{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 12px;align-items:center;margin:14px 0}
.champs.large{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.champs.moyen{grid-template-columns:190px minmax(0,1fr);max-width:760px}
.champs label,.champs .lbl{font-size:14px;color:var(--muted)}
.champs input,.champs select,.champs textarea{width:100%}
.modes{display:flex;gap:6px 16px;flex-wrap:wrap}
.modes label{display:inline-flex;gap:8px;align-items:center;color:var(--ink);font-size:15px;padding:7px 14px 7px 11px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:var(--card)}
.modes label:hover{border-color:var(--accent)}
.modes label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.champs .modes input,.modes input{width:16px;height:16px;margin:0;flex:none}
.erreur{color:var(--bad);font-size:14px;margin:8px 0 0}
.erreur:empty{display:none}
.note{font-size:13px;color:var(--muted);margin:6px 0}
.note.alerte{color:var(--warn)}
.total{font-size:14px;margin:10px 0}
.sous{font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 6px}
details > summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details > summary::-webkit-details-marker{display:none}
details > summary::before{content:"›";color:var(--muted);font-size:20px;line-height:1;width:12px;transition:transform .15s}
details[open] > summary::before{transform:rotate(90deg)}
details[open] > summary{margin-bottom:10px}
details > summary h3{margin:0}
details.aide{margin-top:12px}
details.aide > summary{font-size:14px;color:var(--accent);font-weight:600}

/* formulaire d'ajout d'une ligne */
.ajout{display:grid;grid-template-columns:150px minmax(150px,1.3fr) minmax(170px,1.4fr) 110px 200px auto;gap:10px 12px;align-items:end}
.ajout > div{min-width:0}
.ajout label{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.ajout input,.ajout select{width:100%}
.ajout + .note{margin:10px 0 0}

/* listes et tableaux */
.outils{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.mois-nav{display:inline-flex;align-items:center;gap:8px}
.mois-nav b{min-width:128px;text-align:center}
.mois-nav b::first-letter{text-transform:uppercase}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th,.t td{padding:8px 12px;text-align:left;border-top:1px solid var(--line);vertical-align:middle}
.t thead th{border-top:0;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.t tbody tr:first-child td{border-top:0}
.t thead + tbody tr:first-child td{border-top:1px solid var(--line)}
.t tr.efface td{color:var(--muted)}
.t tr.efface td:first-child a{color:var(--muted)}
.t tfoot td{font-weight:600}
.t td.act{text-align:right;white-space:nowrap}
.t td.centre{text-align:center}
.coche-facture{width:18px;height:18px;margin:0;cursor:pointer;accent-color:var(--accent)}
.t.livre thead th{background:var(--accent-soft);color:var(--ink);font-size:13px;font-weight:650;padding:0;border-bottom:2px solid var(--accent)}
.t.livre thead th:first-child{border-top-left-radius:var(--radius)}
.t.livre thead th:last-child{border-top-right-radius:var(--radius)}
.t.livre thead th.actif{background:var(--accent);color:var(--on-accent)}
.th-btn{display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;color:inherit;font:inherit;font-weight:inherit;padding:10px 12px;cursor:pointer;white-space:nowrap;text-align:left}
.t.livre thead th.num .th-btn{justify-content:flex-end}
.th-btn:hover{text-decoration:underline;text-underline-offset:3px}
.th-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.th-ind{font-size:10px;opacity:.75;display:inline-flex;gap:3px;align-items:center}
.th-ind svg{width:12px;height:12px;fill:currentColor}
th.actif .th-ind{opacity:1}
.menu-col{position:absolute;z-index:20;min-width:240px;max-width:320px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;font-size:14px}
.menu-titre{font-weight:650;padding:6px 10px 4px}
.menu-item{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;padding:7px 10px;border-radius:8px;cursor:pointer}
.menu-item:hover,.menu-item:focus-visible{background:var(--accent-soft);outline:none}
.menu-item.on{font-weight:650}
.menu-item.on::before{content:'✓ '}
.menu-item.effacer{color:var(--bad, #b42318);border-top:1px solid var(--line);border-radius:0 0 8px 8px;margin-top:4px}
.menu-sep{font-size:12px;color:var(--muted);padding:8px 10px 2px;border-top:1px solid var(--line);margin-top:4px}
.menu-liste{max-height:260px;overflow-y:auto}
.menu-coche{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;cursor:pointer}
.menu-coche:hover{background:var(--accent-soft)}
.menu-coche input{width:16px;height:16px;margin:0;flex:none;accent-color:var(--accent)}
.menu-coche span:first-of-type{flex:1}
.filtres-actifs{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:0 0 10px;font-size:13px}
.puce{background:var(--accent-soft);border:1px solid var(--accent);border-radius:999px;padding:3px 10px}
.t td.act .btn{margin-left:4px}
.t td.etroit{width:130px}
.t input:not([type=checkbox]),.t select,.t textarea{width:100%;min-width:90px}
.t textarea{min-width:170px;min-height:52px}
.num{text-align:right!important;font-variant-numeric:tabular-nums;white-space:nowrap}
.nowrap{white-space:nowrap}
.vide{color:var(--muted)}
.videtxt{color:var(--muted);margin:0;font-size:14px}
.pied{font-size:13px;color:var(--muted);margin:8px 2px 0}
.compte{font-size:12px;font-weight:600;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:4px;color:var(--muted);vertical-align:1px}
.liste{list-style:none;margin:0;padding:0}
.liste li{display:flex;gap:8px 12px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.liste li:first-child{border-top:0;padding-top:0}
.liste .txt{display:flex;flex-direction:column;min-width:0;flex:1 1 200px}
.liste .txt span{font-size:13px;color:var(--muted)}
.liste .act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
table.leg{width:100%;max-width:600px}
.leg td{border-top:0!important;padding:4px 8px 4px 0}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutre{background:var(--bg);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.pill.barre{color:var(--muted);text-decoration:line-through;box-shadow:inset 0 0 0 1px var(--line)}

/* synthèse */
.tuiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.tuile{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--radius);padding:14px 16px;min-width:0}
button.tuile{cursor:pointer}
button.tuile:hover{border-color:var(--accent)}
.tuile .lib{font-size:13px;color:var(--muted)}
.tuile b{font-size:28px;font-weight:650;line-height:1.25}
.tuile .sub{font-size:13px;color:var(--muted)}
.tuile.alerte b{color:var(--bad)}
.jauge{height:6px;border-radius:3px;background:var(--line);margin:6px 0 4px;overflow:hidden}
.jauge i{display:block;height:100%;border-radius:3px;background:var(--warn)}
.jauge i.ok{background:var(--accent)}
.graph{overflow:hidden}
.graph svg{display:block;font-family:inherit}
.g-grille{stroke:var(--line);stroke-width:1}
.g-base{stroke:var(--muted);stroke-width:1;opacity:.6}
.g-axe{fill:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.g-axe.on,.g-valeur,.g-etiq{fill:var(--ink);font-size:13px;font-weight:600}
.halo{paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.g-barre{fill:var(--accent);opacity:.42}
.g-barre.on{opacity:1}
.g-seuil{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4;opacity:.65}
.g-zone{fill:transparent;cursor:pointer;outline-offset:-2px}
.g-zone:hover{fill:var(--ink);fill-opacity:.05}
.barre-parts{display:flex;gap:2px;height:22px;margin:4px 0 12px}
.barre-parts i{border-radius:4px;min-width:3px}
.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}.c4{background:var(--c4)}
.pastille{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
#bulle{position:fixed;z-index:30;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:13px;pointer-events:none;max-width:280px}

/* fenêtres, messages */
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);color:var(--ink);padding:22px;width:min(580px,calc(100vw - 32px));max-height:calc(100% - 32px);overflow:auto}
dialog.large{width:min(860px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(20,22,25,.45)}
dialog h3{font-size:18px;margin-bottom:4px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:min(560px,calc(100vw - 32px));opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
#toast.bad{background:var(--bad);color:#fff}
:root[data-theme="dark"] #toast.bad{color:#1a1010}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) #toast.bad{color:#1a1010} }

/* facture */
.deux{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.deux>*{min-width:0}
.cote{display:flex;flex-direction:column;gap:12px}
.cote select,.cote input,.cote textarea{width:100%;min-width:0}
.cote .card{padding:16px}
.cote dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0 0 12px;font-size:14px;align-items:center}
.cote dt{color:var(--muted)}
.cote dd{margin:0}
.cote #mail-texte{min-height:176px;font-size:14px}
.cote .note{margin:2px 0 0}
.cote label.note{margin-top:4px}

<script>window.SUIVI_PROD = true;</script>
<script>
/* Suivi des paiements : noyau.
   Calculs purs, sans accès à la page : testés avec Node (outils/test_noyau.js).
   Conventions : montants en centimes (entiers), dates « AAAA-MM-JJ », mois « AAAA-MM ».
   Une ligne = un rendez-vous : son montant, ce qui a été versé (en une ou plusieurs fois) et, pour les chèques et les espèces,
   la date du dépôt en banque. Les factures se font dans Docorga (décision du 2026-11-14) : l'outil ne numérote rien. */
(function (racine) {
  'use strict';

  const MODES = ['especes', 'cheque', 'virement'];
  const NOM_MODE = { especes: 'Espèces', cheque: 'Chèque', virement: 'Virement' };
  const NOM_STATUT = { payee: 'Payée', partielle: 'Partiellement payée', impayee: 'Impayée' };
  const ABATTEMENT_BNC = 34;   // micro-BNC : l'impôt porte sur 66 % des recettes
  const JOURS_RAPPEL = 3;      // le rappel de dépôt apparaît les trois derniers jours du mois
  // La relance d'un impayé par mail. Les mots entre accolades sont remplacés pour chaque patient :
  // {patient}, {montant} (le total dû), {details} (une ligne par rendez-vous impayé).
  const RELANCE_OBJET = 'Règlement en attente';
  const RELANCE_TEXTE = 'Bonjour,\n\nSauf erreur de ma part, il reste à régler :\n{details}\n\nTotal : {montant}.\n\nVous pouvez régler par virement, ou lors de notre prochain rendez-vous par chèque ou en espèces. Si le règlement a été fait entre-temps, merci de ne pas tenir compte de ce message.\n\nBien cordialement,';
  const MAIL_INCOMPLET = 'Adresse e-mail incomplète : écrivez par exemple prenom.nom' + '@' + 'exemple.fr.';   // jamais d'adresse en clair dans les sources (garde-fou Git)
  const MESSAGERIES = ['appli', 'gmail'];   // Mail ou Outlook sur l'ordinateur (lien « mailto »), ou Gmail dans le navigateur

  // ---------- dates ----------
  const pad = n => String(n).padStart(2, '0');
  const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const deIso = s => { const p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); };
  const ajouterJours = (s, n) => { const d = deIso(s); d.setDate(d.getDate() + n); return iso(d); };
  const lundiDe = s => ajouterJours(s, -((deIso(s).getDay() + 6) % 7));
  const ajouterMois = (m, n) => { const d = new Date(+m.slice(0, 4), +m.slice(5, 7) - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
  const finDeMois = m => iso(new Date(+m.slice(0, 4), +m.slice(5, 7), 0));
  const ecartJours = (a, b) => Math.round((deIso(b) - deIso(a)) / 86400000);
  const estDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && iso(deIso(s)) === s;
  const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  const MOIS_COURT = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  const dateFr = s => { if (!s) return ''; const p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; };
  const nomMois = m => MOIS[+m.slice(5, 7) - 1] + ' ' + m.slice(0, 4);

  // ---------- montants ----------
  function versCentimes(v) {
    if (typeof v === 'number') return isFinite(v) && v >= 0 ? Math.round(v * 100) : null;
    const t = String(v == null ? '' : v).replace(/[\s  €]/g, '').replace(',', '.');
    if (!/^\d{1,7}(\.\d{1,2})?$/.test(t)) return null;   // au plus 9 999 999,99 € : une faute de frappe ne crée pas un montant absurde
    return Math.round(parseFloat(t) * 100);
  }
  function versTaux(v) {   // « 23,4 » -> 23.4 ; vide ou invalide -> null
    const t = String(v == null ? '' : v).replace(/[\s  %]/g, '').replace(',', '.');
    if (!/^\d+(\.\d+)?$/.test(t)) return null;
    const n = parseFloat(t);
    return n >= 0 && n < 100 ? n : null;
  }
  // Jours de consultation par semaine : un nombre de 0,5 à 7, avec au plus deux décimales (« 2,5 » pour deux jours et demi).
  function versJours(v) {
    const t = String(v == null ? '' : v).replace(/[\s  ]/g, '').replace(',', '.');
    if (!/^\d+(\.\d{1,2})?$/.test(t)) return null;
    const n = parseFloat(t);
    return n >= 0.5 && n <= 7 ? n : null;
  }
  function nombre(c, toujoursDecimales) {
    const a = Math.abs(Math.round(c)), ent = Math.floor(a / 100), ct = a % 100;
    const s = String(ent).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return (Math.round(c) < 0 ? '−' : '') + s + (ct || toujoursDecimales ? ',' + pad(ct) : '');
  }
  const euros = c => nombre(c, false) + ' €';
  const eurosFixe = c => nombre(c, true) + ' €';
  const saisie = c => nombre(c, false).replace(/ /g, '');
  const csvMontant = c => (c / 100).toFixed(2).replace('.', ',');
  const sansAccent = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const propre = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
  // Deux écritures du même nom donnent la même clé : accents, majuscules, ponctuation et ordre des mots ne comptent pas.
  const cleNom = s => sansAccent(s).replace(/[^a-z0-9]+/g, ' ').trim().split(' ').filter(Boolean).sort().join(' ');

  const SEMAINES_AN = 52, JOURS_CONGES_MAX = 200;

  // ---------- chiffrement du livre (version en ligne) ----------
  // Le livre est chiffré sur l'appareil avant d'être gardé : AES-GCM 256 bits, clé tirée du mot de passe par
  // PBKDF2-SHA-256 (310 000 tours, sel de 16 octets), un vecteur neuf à chaque enregistrement. Le mot de passe
  // n'est gardé nulle part : oublié, il ne se retrouve pas ; seule une sauvegarde (chiffrée de la même façon) sert.
  const CHIFFRE_FORMAT = 'hadipsy-suivi-chiffre', CHIFFRE_TOURS = 310000, MDP_MIN = 8;
  const subtil = () => { const c = typeof crypto !== 'undefined' ? crypto : null; if (!c || !c.subtle) throw new Error('Ce navigateur ne sait pas chiffrer : ouvrez l’outil dans Safari ou Chrome à jour, à son adresse https.'); return c; };
  const versB64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
  const deB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  function mdpValide(m) {
    if (typeof m !== 'string' || m.length < MDP_MIN) throw new Error('Le mot de passe doit faire au moins ' + MDP_MIN + ' caractères.');
    return m;
  }
  async function deriver(mdp, sel, tours) {
    const c = subtil(), base = await c.subtle.importKey('raw', new TextEncoder().encode(String(mdp).normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
    return c.subtle.deriveKey({ name: 'PBKDF2', salt: sel, iterations: tours, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  // Une clé neuve (nouveau sel) pour un nouveau mot de passe.
  async function nouvelleCle(mdp) { mdpValide(mdp); const sel = subtil().getRandomValues(new Uint8Array(16)); return { cle: await deriver(mdp, sel, CHIFFRE_TOURS), sel: sel, tours: CHIFFRE_TOURS }; }
  async function chiffrer(cle, texte) {
    const c = subtil(), iv = c.getRandomValues(new Uint8Array(12));
    const d = await c.subtle.encrypt({ name: 'AES-GCM', iv: iv }, cle.cle, new TextEncoder().encode(texte));
    return { format: CHIFFRE_FORMAT, version: 1, kdf: 'PBKDF2-SHA-256', tours: cle.tours, sel: versB64(cle.sel), iv: versB64(iv), donnees: versB64(new Uint8Array(d)) };
  }
  const estEnveloppe = o => !!o && o.format === CHIFFRE_FORMAT && o.version === 1 && Number.isInteger(o.tours) && o.tours >= 100000 && o.tours <= 10000000 &&
    ['sel', 'iv', 'donnees'].every(k => typeof o[k] === 'string' && /^[A-Za-z0-9+/]+=*$/.test(o[k]));
  // Rouvre une enveloppe : rend le texte et la clé (pour réenregistrer sans redemander le mot de passe).
  async function dechiffrer(env, mdp) {
    if (!estEnveloppe(env)) throw new Error('Ce n’est pas un livre chiffré de l’outil.');
    const sel = deB64(env.sel), cle = { cle: await deriver(mdp, sel, env.tours), sel: sel, tours: env.tours };
    let d;
    try { d = await subtil().subtle.decrypt({ name: 'AES-GCM', iv: deB64(env.iv) }, cle.cle, deB64(env.donnees)); }
    catch (x) { throw new Error('Mot de passe incorrect.'); }
    return { texte: new TextDecoder().decode(d), cle: cle };
  }
  // Même clé, enveloppe déjà gardée : pour relire ce qu'une autre fenêtre vient d'enregistrer.
  async function dechiffrerAvec(cle, env) {
    if (!estEnveloppe(env) || versB64(cle.sel) !== env.sel) throw new Error('Clé différente.');
    const d = await subtil().subtle.decrypt({ name: 'AES-GCM', iv: deB64(env.iv) }, cle.cle, deB64(env.donnees));
    return new TextDecoder().decode(d);
  }

  // ---------- notes d'amélioration ----------
  // Rangées à part du livre (autre clé de mémoire) : un livre vidé, restauré ou remplacé par l'exemple garde les notes,
  // et le fichier des notes ne contient jamais le livre.
  const NOTE_TYPES = { idee: 'Amélioration', bug: 'Bug', question: 'Question' };
  const NOTE_MAX = 3000;
  const notesVides = () => ({ version: 1, compteur: 0, notes: [] });
  function relireNotes(o) {
    if (!o || o.version !== 1 || !Array.isArray(o.notes) || !estEntier(o.compteur)) return notesVides();
    const vues = {};
    const notes = o.notes.filter(n => n && estId(n.id) && !vues[n.id] && (vues[n.id] = true) && NOTE_TYPES[n.type] && typeof n.texte === 'string' && n.texte.trim() &&
      Number.isFinite(n.cree) && Number.isFinite(n.modifie)).map(n => ({ id: n.id, type: n.type, ecran: String(n.ecran || '').slice(0, 200), texte: n.texte.slice(0, NOTE_MAX), cree: n.cree, modifie: n.modifie, faite: !!n.faite }));
    return { version: 1, compteur: Math.max(o.compteur, ...notes.map(n => rangId(n.id)), 0), notes: notes };
  }
  const texteNote = t => { const v = String(t == null ? '' : t).trim(); if (!v) throw new Error('Écrivez la note avant de l’enregistrer.'); return v.slice(0, NOTE_MAX); };
  const typeNote = t => { if (!NOTE_TYPES[t]) throw new Error('Type de note inconnu.'); return t; };
  const laNote = (c, id) => { const n = c.notes.find(x => x.id === id); if (!n) throw new Error('Note introuvable.'); return n; };
  function ajouterNote(c, o, quand) {
    const type = typeNote(o.type || 'idee'), texte = texteNote(o.texte);   // une note refusée ne consomme pas de numéro
    const n = { id: 'n' + (++c.compteur), type: type, ecran: String(o.ecran || '').slice(0, 200), texte: texte, cree: quand, modifie: quand, faite: false };
    c.notes.push(n);
    return n;
  }
  function modifierNote(c, id, o, quand) { const n = laNote(c, id), t = typeNote(o.type || n.type), x = texteNote(o.texte); n.type = t; n.texte = x; n.modifie = quand; return n; }
  function basculerNote(c, id, quand) { const n = laNote(c, id); n.faite = !n.faite; n.modifie = quand; return n; }
  function supprimerNote(c, id) { laNote(c, id); c.notes = c.notes.filter(x => x.id !== id); }
  const notesOuvertes = c => c.notes.filter(n => !n.faite);
  // Ce qui, dans une note, ressemble à une donnée de patient : un mot du nom d'un patient du livre (3 lettres et plus),
  // une adresse e-mail ou un numéro de téléphone. L'outil prévient, sans bloquer.
  function donneesDansNote(e, texte) {
    const mots = {}, trouves = [];
    sansAccent(texte).split(/[^a-z0-9]+/).forEach(m => { if (m) mots[m] = true; });
    (e ? e.patients : []).forEach(p => { if (sansAccent(p.nom).split(/[^a-z0-9]+/).some(m => m.length >= 3 && mots[m])) trouves.push(p.nom); });
    if (/[^\s@]+@[^\s@]+\.[a-z]{2,}/i.test(texte)) trouves.push('une adresse e-mail');
    if (/(?:\+33|\b0)[1-9](?:[\s.-]?\d{2}){4}\b/.test(texte)) trouves.push('un numéro de téléphone');
    return trouves;
  }
  const horodatage = ms => { const d = new Date(ms); return dateFr(iso(d)) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  function texteNotes(c, maintenant) {
    const fmt = n => '[' + horodatage(n.cree) + '] ' + NOTE_TYPES[n.type] + (n.faite ? ' (réglée)' : '') + '\n  Où : ' + (n.ecran || '—') + '\n  ' + n.texte.replace(/\r?\n/g, '\n  ');
    const ouvertes = c.notes.filter(n => !n.faite), faites = c.notes.filter(n => n.faite);
    return 'Notes de l’outil Suivi des paiements\nExportées le ' + horodatage(maintenant) + '\n\n== À traiter (' + ouvertes.length + ') ==\n\n' + (ouvertes.map(fmt).join('\n\n') || '(aucune)') +
      '\n\n== Réglées (' + faites.length + ') ==\n\n' + (faites.map(fmt).join('\n\n') || '(aucune)') + '\n';
  }

  // ---------- état ----------
  function etatVide() {
    return { version: 3, demo: null, params: { urssaf: 23.4, impot: null, revenuVise: null, joursSemaine: 5, conges: null, fixes: [] }, mail: { messagerie: 'appli', objet: RELANCE_OBJET, texte: RELANCE_TEXTE }, compteurs: { id: 0 }, prestations: [], patients: [], lignes: [] };
  }
  // Les réglages du cabinet tels que Hala les a donnés le 2026-11-13 (tarifs, charges fixes, taux Urssaf).
  function reglagesCabinet(e) {
    const P = (id, libelle, tarif, plus) => e.prestations.push(Object.assign({ id: id, libelle: libelle, tarif: tarif * 100, premier: false, inclutPremier: false }, plus || {}));
    P('premier-psy', '1er rendez-vous de psychothérapie', 80);
    P('suivi', 'Consultation de suivi', 80);
    P('premier-bilan', '1er rendez-vous de bilan', 80, { premier: true });
    P('bilan-tsa', 'Bilan TSA', 680, { inclutPremier: true });
    P('bilan-tdah', 'Bilan TDAH', 450, { inclutPremier: true });
    P('bilan-tsa-tdah', 'Bilan TSA + TDAH', 900, { inclutPremier: true });
    []
      .forEach(f => e.params.fixes.push({ id: nouvelId(e, 'c'), libelle: f[0], montant: f[1] * 100 }));
    e.params.urssaf = 23.4;
    return e;
  }

  // Un livre de la version 2 (avec factures numérotées) devient un livre de la version 3 : numéros, envois, mentions et
  // coordonnées du cabinet et des patients sont abandonnés ; une ligne annulée (jamais payée) disparaît.
  function migrer(o) {
    if (!o || o.version !== 2 || !Array.isArray(o.lignes) || !Array.isArray(o.patients) || !o.compteurs) return o;
    return {
      version: 3, demo: o.demo || null, params: o.params, compteurs: { id: o.compteurs.id }, prestations: o.prestations,
      patients: o.patients.map(p => p && { id: p.id, nom: p.nom, email: adresseValide(p.email) ? p.email : '' }),
      lignes: o.lignes.filter(l => l && !l.annulee).map(l => ({ id: l.id, date: l.date, patientId: l.patientId, prestationId: l.prestationId, libelle: l.libelle, tarif: l.tarif == null ? null : l.tarif, montant: l.montant, versements: l.versements, note: l.note || '' }))
    };
  }

  // Une sauvegarde n'est acceptée que si chaque ligne est complète et cohérente : un fichier abîmé ne casse pas l'outil.
  const estId = s => typeof s === 'string' && /^[a-z0-9-]+$/.test(s);
  const estEntier = n => Number.isInteger(n) && n >= 0;
  function estEtat(o) {
    try {
      if (!o || o.version !== 3 || !o.params || !Array.isArray(o.params.fixes) || !o.compteurs || !estEntier(o.compteurs.id)) return false;
      if (!['impot', 'revenuVise'].every(k => o.params[k] == null || (typeof o.params[k] === 'number' && o.params[k] >= 0))) return false;
      if (o.params.impot != null && !(o.params.impot < 100)) return false;
      if (o.params.joursSemaine != null && versJours(o.params.joursSemaine) !== o.params.joursSemaine) return false;
      if (o.params.conges != null && !(Number.isInteger(o.params.conges) && o.params.conges >= 0 && o.params.conges <= JOURS_CONGES_MAX)) return false;
      if (typeof o.params.urssaf !== 'number' || !(o.params.urssaf >= 0 && o.params.urssaf < 100)) return false;
      if (!['prestations', 'patients', 'lignes'].every(k => Array.isArray(o[k]))) return false;
      const patients = {}, ids = {};
      const neuf = id => estId(id) && !ids[id] && (ids[id] = true);   // un identifiant ne sert qu'une fois dans tout le fichier
      if (!o.patients.every(p => p && neuf(p.id) && typeof p.nom === 'string' && (p.email == null || p.email === '' || adresseValide(p.email)) && (patients[p.id] = true))) return false;
      if (o.mail != null && (typeof o.mail !== 'object' || ['objet', 'texte'].some(k => o.mail[k] != null && typeof o.mail[k] !== 'string'))) return false;
      if (!o.prestations.every(t => t && neuf(t.id) && typeof t.libelle === 'string' && estEntier(t.tarif))) return false;
      if (!o.params.fixes.every(f => f && neuf(f.id) && typeof f.libelle === 'string' && estEntier(f.montant))) return false;
      return o.lignes.every(l => l && neuf(l.id) && estDate(l.date) && patients[l.patientId] && estId(l.prestationId) && typeof l.libelle === 'string' && estEntier(l.montant) && (l.tarif == null || estEntier(l.tarif)) &&
        (l.relanceLe == null || estDate(l.relanceLe)) && (l.facture == null || typeof l.facture === 'boolean') &&
        Array.isArray(l.versements) && l.versements.every(v => v && neuf(v.id) && estDate(v.date) && estEntier(v.montant) && MODES.indexOf(v.mode) >= 0 && (v.deposeLe == null || estDate(v.deposeLe))));
    } catch (x) { return false; }
  }
  // Les lignes restent rangées par date ; le même jour, dans l'ordre où elles ont été saisies.
  const rangId = id => { const m = /(\d+)$/.exec(id); return m ? +m[1] : 0; };
  const ordre = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : rangId(a.id) - rangId(b.id);
  // Complète ce qu'une version précédente n'enregistrait pas encore, et remet d'aplomb l'ordre des lignes et le compteur.
  function normaliser(e) {
    e.prestations.forEach(t => { t.premier = !!t.premier; t.inclutPremier = !!t.inclutPremier; });
    e.patients.forEach(p => { p.email = p.email || ''; });
    e.mail = Object.assign({ messagerie: 'appli', objet: RELANCE_OBJET, texte: RELANCE_TEXTE }, e.mail || {});
    if (MESSAGERIES.indexOf(e.mail.messagerie) < 0) e.mail.messagerie = 'appli';
    e.lignes.forEach(l => { l.note = l.note || ''; if (l.tarif === undefined) l.tarif = null; l.relanceLe = l.relanceLe || null; if (l.facture == null) l.facture = true; l.versements.forEach(v => { v.deposeLe = v.deposeLe || null; }); });
    if (e.params.impot === undefined) e.params.impot = null;
    if (e.params.revenuVise === undefined) e.params.revenuVise = null;
    if (e.params.joursSemaine == null) e.params.joursSemaine = 5;
    if (e.params.conges === undefined) e.params.conges = null;
    e.lignes.sort(ordre);
    let maxId = e.compteurs.id;
    const voir = id => { if (rangId(id) > maxId) maxId = rangId(id); };   // aucun identifiant à venir ne doit en répéter un
    e.patients.forEach(p => voir(p.id)); e.prestations.forEach(t => voir(t.id)); e.params.fixes.forEach(f => voir(f.id));
    e.lignes.forEach(l => { voir(l.id); l.versements.forEach(v => voir(v.id)); });
    e.compteurs.id = maxId;
    return e;
  }
  // Ce que l'outil relit : un livre de la version 3, ou de la version 2 converti. null si rien de valable.
  function relire(o) { const m = migrer(o); return estEtat(m) ? normaliser(m) : null; }

  const nouvelId = (e, prefixe) => prefixe + (++e.compteurs.id);
  const par = (liste, id) => liste.find(x => x.id === id) || null;
  const parDate = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
  const nomPatient = p => p ? p.nom : 'Patient inconnu';
  const libellePrestation = (e, id) => { const t = par(e.prestations, id); return t ? t.libelle : 'Prestation'; };

  // ---------- patients ----------
  function trouverPatient(e, nom) { const k = cleNom(nom); return k ? (e.patients.find(p => cleNom(p.nom) === k) || null) : null; }
  function patientPour(e, nom) {   // le patient de ce nom, créé s'il n'existe pas
    const n = propre(nom);
    if (!cleNom(n)) throw new Error('Indiquez le patient.');
    const p = trouverPatient(e, n);
    if (p) return p;
    const neuf = { id: nouvelId(e, 'p'), nom: n, email: '' };
    e.patients.push(neuf);
    return neuf;
  }
  // Une fiche créée à l'avance, sans ligne. Un nom déjà présent (même autrement écrit) est refusé.
  function ajouterPatient(e, nom, email) {
    const autre = trouverPatient(e, nom), m = String(email == null ? '' : email).trim();
    if (autre) throw new Error('« ' + autre.nom + ' » est déjà dans la liste des patients.');
    if (m && !adresseValide(m)) throw new Error(MAIL_INCOMPLET);
    const p = patientPour(e, nom);
    p.email = m;
    return p;
  }
  // Une adresse écrite simplement, sans rien qui puisse se glisser dans les en-têtes d'un mail.
  const adresseValide = s => /^[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$/.test(String(s || ''));
  // L'adresse e-mail d'un patient : vide, ou une adresse complète.
  function changerEmail(e, id, email) {
    const p = par(e.patients, id), m = String(email == null ? '' : email).trim();
    if (!p) throw new Error('Patient introuvable.');
    if (m && !adresseValide(m)) throw new Error(MAIL_INCOMPLET);
    p.email = m;
    return p;
  }
  const lignesDe = (e, patientId) => e.lignes.filter(l => l.patientId === patientId);
  // Le nouveau nom vaut pour toutes les lignes du patient. S'il désigne déjà une autre fiche, l'erreur porte son identifiant (doublon).
  function renommerPatient(e, id, nom) {
    const p = par(e.patients, id), n = propre(nom);
    if (!p) throw new Error('Patient introuvable.');
    if (!cleNom(n)) throw new Error('Indiquez le nom du patient.');
    const autre = trouverPatient(e, n);
    if (autre && autre.id !== id) { const err = new Error('Une autre fiche porte déjà le nom « ' + autre.nom + ' ».'); err.doublon = autre.id; throw err; }
    p.nom = n;
    return p;
  }
  function fusionnerPatients(e, gardeId, retireId) {
    const g = par(e.patients, gardeId), r = par(e.patients, retireId);
    if (!g || !r || g === r) throw new Error('Fiches introuvables.');
    e.lignes.forEach(l => { if (l.patientId === retireId) l.patientId = gardeId; });
    g.email = g.email || r.email || '';
    e.patients = e.patients.filter(p => p.id !== retireId);
    return g;
  }
  function supprimerPatient(e, id) {
    if (lignesDe(e, id).length) throw new Error('Ce patient a des lignes dans le livre : sa fiche ne peut pas être retirée.');
    e.patients = e.patients.filter(p => p.id !== id);
  }

  // ---------- lignes du livre ----------
  const verse = l => l.versements.reduce((s, v) => s + v.montant, 0);
  const reste = l => Math.max(0, l.montant - verse(l));
  const statut = l => verse(l) >= l.montant ? 'payee' : verse(l) > 0 ? 'partielle' : 'impayee';
  const dernierVersement = l => l.versements.reduce((d, v) => (!d || v.date >= d.date) ? v : d, null);
  const modesDe = l => l.versements.map(v => v.mode).filter((m, i, t) => t.indexOf(m) === i);

  // Un bilan « comprend le 1er rendez-vous » : on propose le tarif moins le 1er rendez-vous déjà compté pour ce patient.
  // Un 1er rendez-vous ne sert qu'une fois : seuls comptent ceux qui suivent le dernier bilan du patient.
  // o.sauf : la ligne que l'on modifie (seules comptent celles d'avant) ; o.date : la date de la ligne à venir ;
  // o.tarif : le tarif retenu quand la ligne a été faite, s'il a changé depuis.
  function montantPropose(e, patientId, prestationId, o) {
    const t = par(e.prestations, prestationId);
    if (!t) return { montant: 0, deduit: 0, tarif: 0 };
    const tarif = o && o.tarif != null ? o.tarif : t.tarif;
    let deduit = 0;
    if (t.inclutPremier && patientId) {
      const fin = o && o.sauf ? e.lignes.findIndex(l => l.id === o.sauf) : -1;
      (fin >= 0 ? e.lignes.slice(0, fin) : o && o.date ? e.lignes.filter(l => l.date <= o.date) : e.lignes).forEach(l => {
        if (l.patientId !== patientId) return;
        const p = par(e.prestations, l.prestationId);
        if (p && p.inclutPremier) deduit = 0;
        else if (p && p.premier) deduit += l.montant;
      });
      if (deduit >= tarif) deduit = 0;   // jamais de bilan à zéro
    }
    return { montant: tarif - deduit, deduit: deduit, tarif: tarif };
  }
  // La première ligne de ce patient à cette date, s'il y en a une : pour signaler une double saisie.
  const ligneDuJour = (e, patientId, date) => e.lignes.find(l => l.patientId === patientId && l.date === date) || null;

  function ajouterLigne(e, d) {
    if (!estDate(d.date)) throw new Error('Indiquez la date.');
    if (d.patientId ? !par(e.patients, d.patientId) : !cleNom(d.patientNom)) throw new Error('Indiquez le patient.');
    const t = par(e.prestations, d.prestationId);
    if (!t) throw new Error('Choisissez la prestation.');
    if (!(Number.isInteger(d.montant) && d.montant > 0)) throw new Error('Le montant doit être supérieur à zéro.');
    const p = d.patientId ? par(e.patients, d.patientId) : patientPour(e, d.patientNom);   // la fiche n'est créée qu'une fois tout le reste accepté
    const l = { id: nouvelId(e, 'l'), date: d.date, patientId: p.id, prestationId: t.id, libelle: t.libelle, tarif: t.tarif, montant: d.montant, versements: [], note: propre(d.note), relanceLe: null, facture: d.facture !== false };
    e.lignes.push(l);
    e.lignes.sort(ordre);
    return l;
  }

  // Facture faite (dans Docorga) ou encore à faire : un simple repère de suivi. Il ne change aucun calcul :
  // l'Urssaf et l'impôt portent sur tout ce qui est encaissé, avec ou sans facture.
  function marquerFacture(e, id, faite) {
    const l = par(e.lignes, id);
    if (!l) throw new Error('Ligne introuvable.');
    l.facture = !!faite;
    return l;
  }
  function modifierLigne(e, id, d) {
    const l = par(e.lignes, id);
    if (!l) throw new Error('Ligne introuvable.');
    const cible = 'patientNom' in d ? trouverPatient(e, d.patientNom) : 'patientId' in d ? par(e.patients, d.patientId) : par(e.patients, l.patientId);
    if ('patientNom' in d && !cleNom(d.patientNom)) throw new Error('Indiquez le patient.');
    if ('patientId' in d && !cible) throw new Error('Indiquez le patient.');
    const change = {
      patient: !cible || cible.id !== l.patientId, prestation: 'prestationId' in d && d.prestationId !== l.prestationId,
      montant: 'montant' in d && d.montant !== l.montant, date: 'date' in d && d.date !== l.date
    };
    const t = par(e.prestations, change.prestation ? d.prestationId : l.prestationId);
    if (change.prestation && !t) throw new Error('Choisissez la prestation.');
    if (change.montant) {
      if (!(Number.isInteger(d.montant) && d.montant > 0)) throw new Error('Le montant doit être supérieur à zéro.');
      if (d.montant < verse(l)) throw new Error('Le montant ne peut pas être inférieur à ce qui a déjà été versé (' + euros(verse(l)) + ').');
    }
    if (change.date && !estDate(d.date)) throw new Error('Indiquez la date.');
    if (change.patient) l.patientId = (cible || patientPour(e, d.patientNom)).id;
    if (change.prestation) { l.prestationId = t.id; l.libelle = t.libelle; l.tarif = t.tarif; }
    if (change.montant) l.montant = d.montant;
    if (change.date) { l.date = d.date; e.lignes.sort(ordre); }
    if ('note' in d) l.note = propre(d.note);
    return l;
  }
  // Une ligne saisie par erreur se supprime ; si un paiement y est enregistré, il faut d'abord le retirer.
  function supprimerLigne(e, id) {
    const l = par(e.lignes, id);
    if (!l) throw new Error('Ligne introuvable.');
    if (l.versements.length) throw new Error('Un paiement est enregistré sur cette ligne : supprimez-le d’abord.');
    e.lignes = e.lignes.filter(x => x.id !== id);
  }

  function encaisser(e, id, d) {
    const l = par(e.lignes, id);
    if (!l) throw new Error('Ligne introuvable.');
    if (!(Number.isInteger(d.montant) && d.montant > 0)) throw new Error('Le montant doit être supérieur à zéro.');
    if (d.montant > reste(l)) throw new Error('Le paiement dépasse ce qu’il reste à payer (' + euros(reste(l)) + ').');
    if (MODES.indexOf(d.mode) < 0) throw new Error('Choisissez le moyen de paiement.');
    if (!estDate(d.date)) throw new Error('Indiquez la date du paiement.');
    const v = { id: nouvelId(e, 'v'), date: d.date, montant: d.montant, mode: d.mode, deposeLe: null };
    l.versements.push(v);
    return v;
  }
  function supprimerVersement(e, ligneId, versementId) {
    const l = par(e.lignes, ligneId);
    if (l) l.versements = l.versements.filter(v => v.id !== versementId);
  }

  // ---------- relance d'un impayé par mail ----------
  // Les lignes encore dues par ce patient, la plus ancienne d'abord.
  const impayeesDe = (e, patientId) => e.lignes.filter(l => l.patientId === patientId && reste(l) > 0);
  // Le mail de relance tiré du modèle des paramètres, pour les lignes choisies (toutes les impayées par défaut).
  // On ne nomme pas la prestation : un mail s'affiche parfois sur un écran verrouillé.
  function mailRelance(e, patientId, ligneIds) {
    const p = par(e.patients, patientId), m = e.mail || {};
    const lignes = impayeesDe(e, patientId).filter(l => !ligneIds || ligneIds.indexOf(l.id) >= 0);
    const total = lignes.reduce((s, l) => s + reste(l), 0), simple = c => euros(c).replace(/[\u00a0\u202f]/g, ' ');
    const details = lignes.map(l => '- rendez-vous du ' + dateFr(l.date) + ' : ' + simple(reste(l)) + (verse(l) ? ' (reste dû sur ' + simple(l.montant) + ')' : '')).join('\n');
    const v = { patient: p ? p.nom : '', montant: simple(total), details: details };
    const remplir = s => String(s).replace(/\{(\w+)\}/g, (tout, k) => Object.prototype.hasOwnProperty.call(v, k) ? v[k] : tout);
    return { a: p && adresseValide(p.email) ? p.email : '', objet: propre(remplir(propre(m.objet) || RELANCE_OBJET)), texte: remplir(propre(m.texte) ? m.texte : RELANCE_TEXTE).replace(/\r\n?/g, '\n').trim(), lignes: lignes.map(l => l.id), total: total };
  }
  // Un mail prérempli : dans la messagerie de l'ordinateur (lien « mailto ») ou dans Gmail.
  const lienMailto = m => 'mailto:' + (adresseValide(m.a) ? encodeURIComponent(m.a).replace(/%40/g, '@') : '') + '?subject=' + encodeURIComponent(m.objet) + '&body=' + encodeURIComponent(m.texte.replace(/\r\n?|\n/g, '\r\n'));
  const lienGmail = m => 'https://mail.google.com/mail/?view=cm&fs=1' + (adresseValide(m.a) ? '&to=' + encodeURIComponent(m.a) : '') + '&su=' + encodeURIComponent(m.objet) + '&body=' + encodeURIComponent(m.texte);
  function noterRelance(e, ligneIds, date) {
    if (!estDate(date)) throw new Error('Indiquez la date de la relance.');
    const lot = e.lignes.filter(l => ligneIds.indexOf(l.id) >= 0 && reste(l) > 0);
    if (!lot.length) throw new Error('Choisissez au moins un rendez-vous à relancer.');
    lot.forEach(l => { l.relanceLe = date; });
    return lot.length;
  }

  // ---------- dépôt en banque (chèques et espèces, en fin de mois) ----------
  function aDeposer(e) {
    const t = [];
    e.lignes.forEach(l => l.versements.forEach(v => { if (v.mode !== 'virement' && !v.deposeLe) t.push({ ligne: l, versement: v, date: v.date, mode: v.mode }); }));
    return t.sort((a, b) => a.mode === b.mode ? parDate(a, b) : a.mode === 'cheque' ? -1 : 1);   // les chèques d'abord, puis les espèces
  }
  function deposer(e, versementIds, date) {
    if (!estDate(date)) throw new Error('Indiquez la date du dépôt.');
    const lot = aDeposer(e).filter(x => versementIds.indexOf(x.versement.id) >= 0);
    if (!lot.length) throw new Error('Cochez au moins un paiement à déposer.');
    lot.forEach(x => { if (x.versement.date > date) throw new Error('Le dépôt ne peut pas précéder un paiement (reçu le ' + dateFr(x.versement.date) + ').'); });
    lot.forEach(x => { x.versement.deposeLe = date; });
    return { n: lot.length, total: lot.reduce((s, x) => s + x.versement.montant, 0) };
  }
  function annulerDepot(e, ligneId, versementId) { const l = par(e.lignes, ligneId), v = l ? par(l.versements, versementId) : null; if (v) v.deposeLe = null; }
  // Les dépôts déjà faits, par date et par nature : c'est ce qui apparaît sur le relevé de la banque.
  function depots(e) {
    const g = {};
    e.lignes.forEach(l => l.versements.forEach(v => {
      if (!v.deposeLe) return;
      const x = g[v.deposeLe + ' ' + v.mode] = g[v.deposeLe + ' ' + v.mode] || { date: v.deposeLe, mode: v.mode, n: 0, total: 0 };
      x.n += 1; x.total += v.montant;
    }));
    return Object.keys(g).sort().reverse().map(k => g[k]);
  }
  function annulerDepots(e, date, mode) {
    let n = 0;
    e.lignes.forEach(l => l.versements.forEach(v => { if (v.deposeLe === date && v.mode === mode) { v.deposeLe = null; n += 1; } }));
    return n;
  }
  // Le rappel de dépôt : les trois derniers jours du mois s'il reste des chèques ou des espèces au cabinet,
  // et tous les jours tant qu'un chèque ou des espèces d'un mois passé ne sont pas déposés. null sinon.
  function rappelDepot(e, jour) {
    const t = aDeposer(e);
    if (!t.length) return null;
    const fin = finDeMois(jour.slice(0, 7)), jours = ecartJours(jour, fin), retard = t.filter(x => x.date < jour.slice(0, 7) + '-01');
    if (jours >= JOURS_RAPPEL && !retard.length) return null;
    const de = mode => { const x = t.filter(y => y.mode === mode); return { n: x.length, total: x.reduce((s, y) => s + y.versement.montant, 0) }; };
    return { raison: retard.length ? 'retard' : 'fin', fin: fin, jours: jours, n: t.length, total: t.reduce((s, x) => s + x.versement.montant, 0), cheques: de('cheque'), especes: de('especes'), plusAncien: t.reduce((m, x) => x.date < m ? x.date : m, t[0].date) };
  }

    if (!c) return;
    ecritures = ecritures.then(() => N.chiffrer(c, texte)).then(env => { localStorage.setItem(CLE, JSON.stringify(env)); memoire = true; })
      .catch(() => { memoire = false; if (!prevenu) { prevenu = true; toast('Le livre n’a pas pu être enregistré sur cet appareil : faites tout de suite une sauvegarde (Paramètres).', 'bad'); } })
      .then(majBadge);
  }
  const enveloppeGardee = () => { try { const t = localStorage.getItem(CLE); const o = t && JSON.parse(t); return N.estEnveloppe(o) ? o : null; } catch (x) { return null; } };
  const derniereSauvegarde = () => { try { return localStorage.getItem(CLE_SAUVE); } catch (x) { return null; } };
  // Les notes d'amélioration ont leur propre place en mémoire : vider, restaurer ou recharger le livre ne les touche pas.
  function chargerNotes() {
    try { const t = localStorage.getItem(CLE_NOTES); carnet = t ? N.relireNotes(JSON.parse(t)) : N.notesVides(); } catch (x) { carnet = N.notesVides(); }
  }
  function sauverNotes() {
    try { localStorage.setItem(CLE_NOTES, JSON.stringify(carnet)); } catch (x) { toast('Ce navigateur ne garde pas les notes : enregistrez le fichier des notes avant de fermer la page.', 'bad'); }
    majNotes();
  }
  function majNotes() {
    const n = N.notesOuvertes(carnet).length, b = $('#notes-compte'), bt = $('#btn-notes');
    b.textContent = n; b.hidden = !n;
    bt.classList.toggle('on', vue.nom === 'notes');
    bt.title = n ? pluriel(n, 'note à traiter', 'notes à traiter') : 'Mes notes : une idée, un bug, une question sur l’outil';
  }
  // Toute modification passe par ici, en tout ou rien : si le noyau refuse, l'état d'avant est remis et l'erreur
  // s'affiche près du formulaire ; sinon l'état est enregistré.
  function muter(fn, zone) {
    const avant = JSON.stringify(etat);
    let r;
    try { r = fn(); } catch (x) { etat = JSON.parse(avant); erreur(x && x.message ? x.message : String(x), zone); return undefined; }
    noter();
    return r === undefined ? true : r;
  }
  function majBadge() {
    const b = $('#badge');
    if (PROD) { b.textContent = 'Non enregistré'; b.hidden = memoire || verrouille; return; }
    b.textContent = (etat && etat.demo ? 'Prototype · patients fictifs' : 'Prototype') + (memoire ? '' : ' · non enregistré');
  }

  // ---------- messages et fenêtres ----------
  function toast(msg, cl) {
    const t = $('#toast');
    t.textContent = msg; t.className = 'on ' + (cl || '');
    clearTimeout(minuterie); minuterie = setTimeout(() => { t.className = ''; }, cl === 'bad' ? 9000 : 6000);
  }
  function erreur(msg, zone) {
    const z = dlg.open ? $('#dlg-erreur', dlg) : zone ? $(zone) : null;
    if (z) z.textContent = msg; else if (msg) toast(msg, 'bad');
  }
  function ouvrir(html, large) {
    suite = null;
    dlg.className = large ? 'large' : '';
    dlg.innerHTML = html;
    if (!dlg.open) dlg.showModal();
    dlg.scrollTop = 0;
    const f = $('[autofocus]', dlg);
    if (f) f.focus();
  }
  function fermer() { suite = null; if (dlg.open) dlg.close(); dlg.innerHTML = ''; }
  // o.retour : ce qu'on rouvre si la personne renonce ; o.apres : ce qu'on fait une fois l'action confirmée ; o.non : le libellé pour renoncer.
  // Quand l'action ne se rattrape pas (o.danger, o.prudent), la touche Entrée tombe sur le bouton qui renonce.
  function confirmer(titre, texte, libelle, fn, o) {
    o = o || {};
    const prudent = o.danger || o.prudent;
    ouvrir(`<h3>${h(titre)}</h3><p>${h(texte)}</p><p class="erreur" id="dlg-erreur" role="alert"></p>
      <div class="row fin"><button type="button" class="btn" data-a="non"${prudent ? ' autofocus' : ''}>${h(o.non || 'Annuler')}</button><button type="button" class="btn ${o.danger ? 'danger' : 'pri'}" data-a="oui"${prudent ? '' : ' autofocus'}>${h(libelle)}</button></div>`);
    suite = { fn: fn, retour: o.retour || null, apres: o.apres || null };
  }
  async function telecharger(nom, texte, mime) {
    const dire = msg => (dlg.open ? erreur : toast)(msg);
    // Sur un téléphone, la feuille de partage permet « Enregistrer dans Fichiers » (un .ics s'ouvre directement dans le calendrier).
    if (PROD && !/\.ics$/.test(nom) && window.matchMedia && matchMedia('(pointer: coarse)').matches && navigator.canShare) {
      try {
        const f = new File([texte], nom, { type: mime });
        if (navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: nom }); return true; }
      } catch (x) { if (x && x.name === 'AbortError') return false; }
    }
    if (window.claude && typeof window.claude.use === 'function') {   // aperçu en ligne : l'enregistrement passe par la plateforme
      try { const d = await window.claude.use('downloads'); if (d) { await d.save({ filename: nom, data: texte }); return true; } }
      catch (x) {
        if (x && x.code === 'declined') return false;
        if (x && x.code === 'rejected_extension') { dire('L’aperçu en ligne n’enregistre pas ce type de fichier (' + nom.split('.').pop() + '). Il s’enregistre depuis le fichier de l’outil ouvert sur l’ordinateur.'); return false; }
      }
    }
    try {
      const url = URL.createObjectURL(new Blob([texte], { type: mime })), a = document.createElement('a');
      a.href = url; a.download = nom;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      if (ENCADRE) dire('Si rien ne se télécharge dans cet aperçu, ouvrez le fichier de l’outil sur l’ordinateur.');
      return true;
    } catch (x) { erreur('Le fichier n’a pas pu être enregistré.'); return false; }
  }

  // ---------- navigation ----------
  function lire(nom) {
    return { nom: nom === 'notes' || ONGLETS.some(o => o[0] === nom) ? nom : 'encaissements', id: null };
  }
  function aller(nom) {
    vue = lire(nom);
    try { if (location.hash !== '#' + nom) location.hash = nom; } catch (x) { /* adresse non modifiable : la vue change quand même */ }
    rendre();
    window.scrollTo(0, 0);
  }
  // L'outil est resté ouvert pendant la nuit : la date proposée et le mois affiché repassent à aujourd'hui.
  function jourChange() {
    const j = auj(), ancien = F.jour.slice(0, 7);
    if (j === F.jour) return false;
    if (F.mois === ancien) F.mois = j.slice(0, 7);
    if (F.synMois === ancien) F.synMois = j.slice(0, 7);
    F.saisieDate = ''; F.jour = j;
    return true;
  }
  // o.vierge : le formulaire d'ajout repart de zéro (après un ajout réussi) ; sinon ce qui y est saisi est conservé.
  function rendre(o) {
    if (verrouille) return rendreVerrou();
    const garde = {}, lendemain = jourChange();
    if (!(o && o.vierge)) $$('[data-garde]', page).forEach(el => { garde[el.id] = el.value; });
    if (lendemain) delete garde['aj-date'];
    if (F.ecran !== vue.nom) { F.ecran = vue.nom; F.saisieDate = ''; }   // la date d'une saisie en série ne survit pas à un changement d'écran
    $('#onglets').innerHTML = ONGLETS.map(x => `<button type="button" data-a="aller" data-vue="${x[0]}"${x[0] === vue.nom ? ' class="on" aria-current="page"' : ''}>${x[1]}</button>`).join('');
    majBadge(); majNotes(); $('#btn-notes').hidden = false; $('#btn-verrou').hidden = !PROD;
    if (F.menuCol) fermerMenuCol();
    bulle.hidden = true;
    page.className = 'vue-' + vue.nom;   // l'écran des encaissements prend plus de largeur pour son tableau
    page.innerHTML = (VUES[vue.nom] || VUES.encaissements)();
    Object.keys(garde).forEach(id => { const el = document.getElementById(id); if (el) el.value = garde[id]; });
    if ($('#aj-info')) ajInfo('doux');
    if ($('#graph')) dessiner();
  }
  function navMois(mois, action) {
    const dernier = mois >= auj().slice(0, 7);
    return `<div class="mois-nav"><button type="button" class="btn sm" data-a="${action}" data-d="-1" aria-label="Mois précédent">‹</button><b>${h(N.nomMois(mois))}</b><button type="button" class="btn sm" data-a="${action}" data-d="1" aria-label="Mois suivant"${dernier ? ' disabled' : ''}>›</button></div>`;
  }
  const avis = () => PROD ? htmlRappelSauvegarde() : `<p class="avis">${etat.demo ? 'Prototype : les patients et les lignes sont inventés, les tarifs et les charges sont ceux du cabinet. ' : 'Prototype. '}Ne saisissez pas de vrais noms, rien n’est encore chiffré ni sauvegardé.</p>`;

  // --- rappel de dépôt : les derniers jours du mois, ou tant qu'un mois passé n'est pas déposé. « Plus tard » le cache jusqu'au lendemain.
  const plusTard = () => { try { return localStorage.getItem(CLE_RAPPEL); } catch (x) { return null; } };
  function htmlRappel() {
    const r = N.rappelDepot(etat, auj());
    if (!r || plusTard() === auj()) return '';
    const quoi = [r.cheques.n ? pluriel(r.cheques.n, 'chèque', 'chèques') + ' (' + E(r.cheques.total) + ')' : '', r.especes.n ? 'des espèces (' + E(r.especes.total) + ')' : ''].filter(Boolean).join(' et ');
    const texte = r.raison === 'retard' ? 'Dépôt en retard : ' + quoi + ' attendent encore d’être déposés, dont des paiements du mois dernier.'
      : (r.jours === 0 ? 'Dernier jour du mois' : 'Fin du mois dans ' + pluriel(r.jours, 'jour', 'jours')) + ' : pensez à déposer ' + quoi + ' à la banque.';
    return `<div class="rappel ${N.niveauDepot(r.total)}" role="status"><span class="txt"><b>${h(texte)}</b> Total : ${E(r.total)}.</span>
      <span class="row">${bt('Déposer en banque', 'depots', '', 'pri')}${bt('Plus tard', 'rappelPlusTard', '', 'link')}</span></div>`;
  }
  ACTIONS.rappelPlusTard = () => { try { localStorage.setItem(CLE_RAPPEL, auj()); } catch (x) { /* mémoire indisponible : le rappel reviendra */ } rendre(); };
  // Le bouton « Déposer en banque » : vert jusqu'à 400 €, jaune jusqu'à 800 €, rouge au-delà.
  function boutonDepot() {
    const t = somme(N.aDeposer(etat), x => x.versement.montant), niv = N.niveauDepot(t);
    return `<button type="button" class="btn depot ${niv}" data-a="depots" title="${t ? 'Chèques et espèces au cabinet : vert jusqu’à 400 €, jaune jusqu’à 800 €, rouge au-delà' : 'Historique des dépôts'}">${t ? 'Déposer en banque · ' + E(t) : 'Dépôts en banque'}</button>`;
  }

  // ====================================================================== 1. ENCAISSEMENTS
  function celluleDepot(l) {
    const t = l.versements.filter(v => v.mode !== 'virement');
    if (!t.length) return TIRET;
    if (t.some(v => !v.deposeLe)) return pill('warn', 'À déposer');
    return '<span class="vide">Déposé le ' + h(jourMois(t.map(v => v.deposeLe).sort().pop())) + '</span>';
  }
  function ligneLivre(l) {
    const d = N.dernierVersement(l), r = N.reste(l);
    return `<tr class="${r > 0 ? 'du' : ''}">
      <td class="nowrap c-date">${h(jourMois(l.date))}</td>
      <td class="centre c-fact"><label class="lab-fact"><input type="checkbox" class="coche-facture" data-c="facture" data-id="${l.id}"${l.facture === false ? '' : ' checked'} aria-label="Facture faite pour le rendez-vous du ${h(jourMois(l.date))}" title="${l.facture === false ? 'Facture à faire dans Docorga' : 'Facture faite'}"><span class="mobile-seul">Facture faite</span></label></td>
      <td class="nom c-nom">${h(N.nomPatient(patient(l.patientId)))}</td><td class="presta c-presta">${h(l.libelle)}${l.note ? ' <span class="vide">· ' + h(l.note) + '</span>' : ''}</td>
      <td class="num c-mont" data-l="Montant">${E(l.montant)}</td><td class="num c-verse" data-l="Versé">${N.verse(l) ? E(N.verse(l)) : TIRET}</td><td class="num c-reste" data-l="Reste">${r ? '<b>' + E(r) + '</b>' : TIRET}</td>
      <td class="c-statut">${pillStatut(l)}${l.relanceLe && N.reste(l) > 0 ? '<span class="sous-pill">relancé le ' + h(jourMois(l.relanceLe)) + '</span>' : ''}</td>
      <td class="nowrap c-paye" data-l="Payé le">${d ? h(jourMois(d.date)) + ' · ' + N.modesDe(l).map(m => N.NOM_MODE[m].toLowerCase()).join(' + ') : TIRET}</td>
      <td class="nowrap c-depot" data-l="Dépôt">${celluleDepot(l)}</td>
      <td class="act">${r > 0 ? bt('Encaisser', 'encaisser', `data-id="${l.id}"`, 'pri') + bt('Relancer', 'relancer', `data-pid="${l.patientId}"`, '') : ''}${bt('Modifier', 'ligne', `data-id="${l.id}"`, 'link')}</td></tr>`;
  }
  // Les lignes affichées : le mois choisi, ou un filtre sur tout le livre. Une recherche lancée depuis « Le mois » porte sur tout le livre.
  // ---------- colonnes du livre : tri et filtres ----------
  // Chaque colonne : son titre, la valeur qui sert au tri, et pour les colonnes à filtrer, les étiquettes d'une ligne.
  const RANG_STATUT = { impayee: 0, partielle: 1, payee: 2 };
  const etiquetteDepot = l => { const t = l.versements.filter(v => v.mode !== 'virement'); return !t.length ? 'Sans chèque ni espèces' : t.some(v => !v.deposeLe) ? 'À déposer' : 'Déposé'; };
  const COLS = [
    { id: 'date', lib: 'Date', type: 'date', tri: l => l.date },
    { id: 'facture', lib: 'Facture', type: 'ordre', tri: l => l.facture === false ? 0 : 1, cats: l => [l.facture === false ? 'À faire' : 'Faite'], ordreCats: ['À faire', 'Faite'], sens: ['À faire d’abord', 'Faites d’abord'] },
    { id: 'patient', lib: 'Patient', type: 'texte', tri: l => N.nomPatient(patient(l.patientId)), cats: l => [N.nomPatient(patient(l.patientId))] },
    { id: 'prestation', lib: 'Prestation', type: 'texte', tri: l => l.libelle, cats: l => [l.libelle] },
    { id: 'montant', lib: 'Montant', type: 'num', tri: l => l.montant },
    { id: 'verse', lib: 'Versé', type: 'num', tri: N.verse },
    { id: 'reste', lib: 'Reste', type: 'num', tri: N.reste },
    { id: 'statut', lib: 'Statut', type: 'ordre', tri: l => RANG_STATUT[N.statut(l)], cats: l => [N.NOM_STATUT[N.statut(l)]].concat(l.relanceLe && N.reste(l) > 0 ? ['Relancée'] : []), ordreCats: ['Impayée', 'Partiellement payée', 'Payée', 'Relancée'] },
    { id: 'paye', lib: 'Payé le', type: 'date', tri: l => { const d = N.dernierVersement(l); return d ? d.date : ''; }, cats: l => l.versements.length ? N.modesDe(l).map(m => N.NOM_MODE[m]) : ['Pas encore payé'], ordreCats: ['Espèces', 'Chèque', 'Virement', 'Pas encore payé'] },
    { id: 'depot', lib: 'Dépôt', type: 'texte', tri: etiquetteDepot, cats: l => [etiquetteDepot(l)], ordreCats: ['À déposer', 'Déposé', 'Sans chèque ni espèces'] }
  ];
  const COL = id => COLS.find(c => c.id === id);
  const SENS = { date: ['Du plus ancien au plus récent', 'Du plus récent au plus ancien'], texte: ['De A à Z', 'De Z à A'], num: ['Du plus petit au plus grand', 'Du plus grand au plus petit'], ordre: ['Impayées d’abord', 'Payées d’abord'] };
  const filtreActif = id => Array.isArray(F.filtres[id]);
  const passeFiltres = (l, sauf) => COLS.every(c => c.id === sauf || !filtreActif(c.id) || c.cats(l).some(v => F.filtres[c.id].indexOf(v) >= 0));
  // Les lignes de base (le mois, les impayées, à déposer, ou la recherche), avant les filtres de colonnes, dans l'ordre du livre.
  function lignesDeBase() {
    const q = N.sansAccent(F.texte.trim());
    let liste = F.filtre === 'impayees' ? etat.lignes.filter(l => N.reste(l) > 0)
      : F.filtre === 'deposer' ? etat.lignes.filter(l => l.versements.some(v => v.mode !== 'virement' && !v.deposeLe))
      : q ? etat.lignes : etat.lignes.filter(l => l.date.slice(0, 7) === F.mois);
    if (q) liste = liste.filter(l => N.sansAccent(N.nomPatient(patient(l.patientId)) + ' ' + l.libelle + ' ' + l.note).indexOf(q) >= 0);
    return liste;
  }
  // Sans tri choisi : le plus récent en haut, comme avant. Avec un tri : à valeur égale, le plus récent en haut.
  function trier(liste) {
    const rang = new Map(liste.map((l, i) => [l, i])), recents = liste.slice().reverse();
    if (!F.tri) return recents;
    const c = COL(F.tri.col), k = F.tri.sens === 'desc' ? -1 : 1;
    const cmp = (a, b) => { const x = c.tri(a), y = c.tri(b); return typeof x === 'number' ? x - y : String(x).localeCompare(String(y), 'fr', { sensitivity: 'base', numeric: true }); };
    return recents.sort((a, b) => k * cmp(a, b) || rang.get(b) - rang.get(a));
  }
  function enTete(c) {
    const actif = F.tri && F.tri.col === c.id, filtre = filtreActif(c.id);
    return `<th class="${c.type === 'num' ? 'num ' : ''}${actif || filtre ? 'actif' : ''}"${actif ? ` aria-sort="${F.tri.sens === 'asc' ? 'ascending' : 'descending'}"` : ''}><button type="button" class="th-btn" data-a="colMenu" data-col="${c.id}" aria-haspopup="true" aria-expanded="${F.menuCol === c.id}" title="Trier${c.cats ? ' ou filtrer' : ''}">${h(c.lib)}<span class="th-ind" aria-hidden="true">${actif ? (F.tri.sens === 'asc' ? '▲' : '▼') : ''}${filtre ? '<svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>' : ''}${!actif && !filtre ? '▾' : ''}</span></button></th>`;
  }
  function htmlLivre() {
    const q = N.sansAccent(F.texte.trim()), base = lignesDeBase(), filtres = COLS.filter(c => filtreActif(c.id));
    const vues = base.filter(l => passeFiltres(l));
    const total = vues.length;
    const liste = trier(vues).slice(0, q ? 200 : total);
    const bandeau = filtres.length || F.tri ? `<div class="filtres-actifs">${F.tri ? `<span class="puce">Tri : ${h(COL(F.tri.col).lib)}, ${h((COL(F.tri.col).sens || SENS[COL(F.tri.col).type])[F.tri.sens === 'asc' ? 0 : 1].toLowerCase())}</span>` : ''}${filtres.map(c => `<span class="puce">${h(c.lib)} : ${h(F.filtres[c.id].length ? F.filtres[c.id].join(', ') : 'rien')}</span>`).join('')}
      <button type="button" class="btn sm link" data-a="colToutEffacer">Tout effacer</button>${filtres.length ? `<span class="vide">${pluriel(total, 'ligne affichée', 'lignes affichées')} sur ${base.length}</span>` : ''}</div>` : '';
    if (!total && !(filtres.length && base.length)) return bandeau + `<p class="videtxt">${q ? 'Aucune ligne ne correspond à cette recherche.' : F.filtre === 'impayees' ? 'Tout est payé.' : F.filtre === 'deposer' ? 'Rien à déposer en banque.' : 'Aucune ligne en ' + h(N.nomMois(F.mois)) + '.'}</p>`;
    return bandeau + `<div class="tablewrap"><table class="t livre"><thead><tr>${COLS.map(enTete).join('')}<th></th></tr></thead>
      <tbody>${liste.map(ligneLivre).join('') || `<tr><td colspan="${COLS.length + 1}" class="videtxt">Aucune ligne ne correspond aux filtres.</td></tr>`}</tbody>
      <tfoot><tr><td colspan="4">${pluriel(liste.length, 'ligne', 'lignes')}</td><td class="num" data-l="Montant">${E(somme(liste, l => l.montant))}</td><td class="num" data-l="Versé">${E(somme(liste, N.verse))}</td><td class="num" data-l="Reste">${E(somme(liste, N.reste))}</td><td colspan="4"></td></tr></tfoot></table></div>
      ${q && F.filtre === 'mois' ? `<p class="pied">Recherche dans tout le livre${total > liste.length ? ' : les 200 lignes les plus récentes sur ' + total : ''}.</p>` : ''}`;
  }
  // Le menu d'une colonne : trier dans un sens ou dans l'autre ; pour les colonnes à étiquettes, cocher ce qu'on veut voir.
  function htmlMenuCol(c) {
    const autres = lignesDeBase().filter(l => passeFiltres(l, c.id)), compte = {};
    if (c.cats) autres.forEach(l => c.cats(l).forEach(v => { compte[v] = (compte[v] || 0) + 1; }));
    if (c.cats && filtreActif(c.id)) F.filtres[c.id].forEach(v => { if (!(v in compte)) compte[v] = 0; });
    const valeurs = Object.keys(compte).sort((a, b) => c.ordreCats ? c.ordreCats.indexOf(a) - c.ordreCats.indexOf(b) : a.localeCompare(b, 'fr'));
    const coche = v => !filtreActif(c.id) || F.filtres[c.id].indexOf(v) >= 0;
    const sens = c.sens || SENS[c.type], tri = F.tri && F.tri.col === c.id ? F.tri.sens : '';
    return `<div class="menu-titre">${h(c.lib)}</div>
      <button type="button" class="menu-item${tri === 'asc' ? ' on' : ''}" data-a="colTri" data-col="${c.id}" data-sens="asc">${h(sens[0])}</button>
      <button type="button" class="menu-item${tri === 'desc' ? ' on' : ''}" data-a="colTri" data-col="${c.id}" data-sens="desc">${h(sens[1])}</button>
      ${c.cats ? `<div class="menu-sep">Afficher</div>
      <label class="menu-coche"><input type="checkbox" data-c="colTout" data-col="${c.id}"${valeurs.every(coche) ? ' checked' : ''}><b>Tout</b></label>
      <div class="menu-liste">${valeurs.map(v => `<label class="menu-coche"><input type="checkbox" data-c="colFiltre" data-col="${c.id}" value="${h(v)}"${coche(v) ? ' checked' : ''}><span>${h(v)}</span><span class="vide">${compte[v]}</span></label>`).join('') || '<p class="vide">Aucune valeur.</p>'}</div>` : ''}
      ${tri || filtreActif(c.id) ? `<button type="button" class="menu-item effacer" data-a="colEffacer" data-col="${c.id}">Effacer le tri et le filtre de cette colonne</button>` : ''}`;
  }
  function fermerMenuCol() { const m = $('#menu-col'); if (m) m.remove(); F.menuCol = ''; }
  function placerMenuCol() {
    const m = $('#menu-col'), b = F.menuCol && $('.th-btn[data-col="' + F.menuCol + '"]');

  VUES.encaissements = function () {

  FORMS.ajout = function () {

    if (auj() !== F.jour) { rendre(); return erreur('La date du jour a changé depuis l’ouverture : vérifiez la date, puis ajoutez la ligne.', zone); }
    if (!N.cleNom(nom)) return erreur('Indiquez le patient.', zone);
    if (!(m > 0)) return erreur('Indiquez le montant, par exemple 80.', zone);
    if (!date) return erreur('Indiquez la date.', zone);
    if (date > auj()) return erreur('La date ne peut pas être dans le futur.', zone);

    const faire = () => muter(() => {
      const x = N.ajouterLigne(etat, { date: date, patientNom: nom, prestationId: prestation, montant: m });

  // ====================================================================== 3. SYNTHÈSE
  // Histogramme des douze derniers mois, dessiné à la largeur réelle de la page, avec les deux seuils en repères.
  function histogramme(s, L) {
    const etroit = L < 640, H = 250, g = 46, d = etroit ? 10 : 156, haut = 20, bas = 28, zone = H - haut - bas, larg = (L - g - d) / 12;
    const reperes = [['Seuil de confort', s.seuils.confort], ['Point mort', s.seuils.pointMort]].filter(r => r[1] != null);
    const max = Math.max.apply(null, s.douze.map(m => m.encaisse).concat(reperes.map(r => r[1]), [100000])) * 1.1;
    const pas = [25000, 50000, 100000, 200000, 250000, 500000, 1000000, 2000000, 5000000].find(p => max / p <= 5) || 10000000;
    const y = v => Math.round((haut + zone - v / max * zone) * 10) / 10;
    let svg = '';
    for (let v = 0; v <= max; v += pas) svg += `<line class="g-grille" x1="${g}" x2="${L - d}" y1="${y(v)}" y2="${y(v)}"/><text class="g-axe" x="${g - 8}" y="${y(v) + 4}" text-anchor="end">${N.nombre(v)}</text>`;
    s.douze.forEach((m, i) => {
      const x = Math.round(g + i * larg + larg / 2), w = Math.max(6, Math.min(34, larg - 10)), y0 = y(0), y1 = y(m.encaisse), r = Math.max(0, Math.min(4, (y0 - y1) / 2, w / 2));
      const actif = m.mois === s.mois, c = s.seuils.confort, court = N.MOIS_COURT[+m.mois.slice(5, 7) - 1];
      const tip = N.nomMois(m.mois) + ' : ' + E(m.encaisse) + (c ? (m.encaisse >= c ? ' · seuil de confort atteint' : ' · ' + E(c - m.encaisse) + ' sous le seuil de confort') : '');
      if (m.encaisse > 0) svg += `<path class="g-barre${actif ? ' on' : ''}" d="M${x - w / 2},${y0} V${y1 + r} Q${x - w / 2},${y1} ${x - w / 2 + r},${y1} H${x + w / 2 - r} Q${x + w / 2},${y1} ${x + w / 2},${y1 + r} V${y0} Z"/>`;
      svg += `<text class="g-axe${actif ? ' on' : ''}" x="${x}" y="${H - 9}" text-anchor="middle">${larg < 36 ? court.charAt(0).toUpperCase() : court}</text>`;
      svg += `<rect class="g-zone" x="${g + i * larg}" y="${haut}" width="${larg}" height="${zone + bas}" data-a="synMois" data-m="${m.mois}" data-tip="${h(tip)}" tabindex="0" role="button" aria-label="${h(tip)}"/>`;
    });
    svg += `<line class="g-base" x1="${g}" x2="${L - d}" y1="${y(0)}" y2="${y(0)}"/>`;
    let bas0 = -99;
    reperes.sort((a, b) => b[1] - a[1]);
    // à droite du tracé : deux étiquettes de deux lignes, qui ne se chevauchent pas et ne sortent pas par le bas
    const pos = reperes.map(r => { bas0 = Math.max(y(r[1]) + 4, bas0 + 34); return bas0; });
    for (let i = pos.length - 1, plafond = H - 21; i >= 0; i--) { pos[i] = Math.min(pos[i], plafond); plafond = pos[i] - 34; }
    bas0 = -99;
    reperes.forEach((r, i) => {
      const yy = y(r[1]);
      svg += `<line class="g-seuil" x1="${g}" x2="${L - d + (etroit ? 0 : 6)}" y1="${yy}" y2="${yy}"/>`;
      if (etroit) { const yt = yy - 5 < bas0 + 13 ? yy + 14 : yy - 5; bas0 = yt; svg += `<text class="g-etiq halo" x="${g + 4}" y="${yt}">${r[0]} · ${E(r[1])}</text>`; }
      else svg += `<text class="g-etiq" x="${L - d + 12}" y="${pos[i]}">${r[0]}</text><text class="g-axe" x="${L - d + 12}" y="${pos[i] + 15}">${E(r[1])} par mois</text>`;
    });
    const act = s.douze[11];   // la valeur du mois affiché, par-dessus les repères, sans dépasser le bord droit
    if (act.encaisse > 0) {
      const txt = N.nombre(act.encaisse).replace(/\u202f/g, '\u00a0'), xv = Math.min(Math.round(g + 11 * larg + larg / 2), L - 3 - txt.length * 3.9);
      svg += `<text class="g-valeur halo" x="${xv}" y="${y(act.encaisse) - 6}" text-anchor="middle">${txt}</text>`;
    }
    return `<svg width="${L}" height="${H}" viewBox="0 0 ${L} ${H}" role="img" aria-label="Encaissements des douze derniers mois, en euros">${svg}</svg>`;
  }
  function dessiner() {
    const z = $('#graph');

  VUES.synthese = function () {

      ${r.net < 0 ? `<p class="avis">Les encaissements ne couvrent pas encore les charges du mois : il manque ${E(-r.net)}.</p>` : ''}
      <div class="barre-parts" aria-hidden="true">${parts.filter(x => x[2] > 0).map(x => `<i class="${x[0]}" style="flex:${x[2]}" data-tip="${h(x[1] + ' : ' + E(x[2]) + ' · ' + pct(x[2], base) + ' %')}"></i>`).join('')}</div>
      <table class="t leg"><tbody>${parts.map(x => { const absent = sansImpot && x[0] === 'c3'; return `<tr><td><i class="pastille ${x[0]}"></i>${h(x[1])}</td><td class="num">${absent ? TIRET : E(x[2])}</td><td class="num vide">${absent ? '' : pct(x[2], base) + ' %'}</td></tr>`; }).join('')}</tbody></table>`}
      ${sansImpot ? `<p class="note">Le taux d’impôt à mettre de côté n’est pas encore réglé : ${lien('parametres', 'le régler dans les paramètres')}.</p>` : ''}

    <section class="card"><h3>Relance par mail</h3>

  ACTIONS.prestationAjouter = () => { let id; muter(() => { id = 't' + (++etat.compteurs.id); etat.prestations.push({ id: id, libelle: 'Nouvelle prestation', tarif: 0, premier: false, inclutPremier: false }); }); rendre(); const z = $('#pre-libelle-' + id); if (z) { z.focus(); z.select(); } };

      </form></section>
    <section class="card"><div class="titre-carte"><h3>À traiter <span class="compte">${ouv.length}</span></h3>
        <div class="row">${bt('Enregistrer le fichier des notes', 'notesFichier', toutes.length ? '' : 'disabled')}${bt('Copier le texte', 'notesCopier', toutes.length ? '' : 'disabled', 'link')}</div></div>

    ${faites.length ? `<section class="card"><details id="det-faites"${ouvert('det-faites')}><summary><h3>Réglées <span class="compte">${faites.length}</span></h3></summary>${faites.map(carte).join('')}</details></section>` : ''}
    <p class="pied">Les notes restent dans ce navigateur, à part du livre : vider, restaurer ou recharger le livre ne les efface pas. Une fois la correction faite, marquez la note comme réglée.</p>`;
  };
  ACTIONS.notes = () => {
    if (vue.nom !== 'notes') F.noteEcran = { encaissements: 'Encaissements', synthese: 'Synthèse', parametres: 'Paramètres' }[vue.nom] || 'Général';
