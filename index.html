  CHANGES.noteType = el => { F.noteType = el.value; };
  CHANGES.noteEcran = el => { F.noteEcran = el.value; };
  // Enregistre une note, après avoir prévenu si elle semble contenir une donnée de patient (nom du livre, e-mail, téléphone).
  function enregistrerNote(fn, texte, zone, message, retour, vider) {
    const faire = () => {
      const avant = JSON.stringify(carnet);
      try { fn(); } catch (x) { carnet = N.relireNotes(JSON.parse(avant)); erreur(x && x.message ? x.message : String(x), zone); return false; }
      if (vider) { const t = $('#note-texte'); if (t) t.value = ''; }
      sauverNotes(); toast(message);
      return true;
    };
    if (!texte.trim()) return erreur('Écrivez la note avant de l’enregistrer.', zone);
    const d = N.donneesDansNote(etat, texte);
    if (!d.length) { if (faire()) { fermer(); rendre({ vierge: vider }); } return; }
    const liste = d.length === 1 ? d[0] : d.slice(0, -1).join(', ') + ' et ' + d[d.length - 1];
    confirmer('Une donnée de patient dans la note ?', 'Cette note semble contenir : ' + liste + '. Les notes sont faites pour être envoyées : retirez tout ce qui permettrait de reconnaître un patient.', 'Enregistrer quand même', faire, { prudent: true, non: 'Corriger la note', retour: retour });
  }
  FORMS.noteAjout = () => {

    enregistrerNote(() => N.ajouterNote(carnet, { type: c ? c.value : 'idee', ecran: $('#note-ecran').value, texte: texte }, Date.now()), texte, '#note-erreur', 'Note ajoutée.', null, true);
  };
  function dlgNote(id, b) {

    ouvrir(`<h3>Modifier la note</h3><form data-f="noteModif" data-id="${n.id}" novalidate>

      <p class="erreur" id="dlg-erreur" role="alert"></p>

  }
  FORMS.noteModif = f => {

    enregistrerNote(() => N.modifierNote(carnet, id, { type: type, texte: texte }, Date.now()), texte, null, 'Note modifiée.', () => dlgNote(id, { type: type, texte: texte }), false);

  ACTIONS.noteModifier = el => dlgNote(el.dataset.id);
  ACTIONS.noteBasculer = el => {
    try { const n = N.basculerNote(carnet, el.dataset.id, Date.now()); sauverNotes(); rendre(); toast(n.faite ? 'Note marquée comme réglée.' : 'Note rouverte.'); } catch (x) { erreur(x.message); }
  };
  ACTIONS.noteSupprimer = el => confirmer('Supprimer cette note ?', 'Elle disparaîtra aussi du fichier des notes. Une note traitée peut plutôt être marquée comme réglée.', 'Supprimer', () => {

  }, { danger: true });
  ACTIONS.notesFichier = () => telecharger('suivi-paiements-notes-' + auj() + '.txt', N.texteNotes(carnet, Date.now()), 'text/plain').then(ok => { if (ok && !ENCADRE) toast('Fichier des notes enregistré dans les téléchargements : envoyez-le à Hugo.'); });
  ACTIONS.notesCopier = () => {

    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => toast('Notes copiées : collez-les dans un mail à Hugo.'), () => toast('Copie impossible : utilisez « Enregistrer le fichier des notes ».', 'bad'));
    else toast('Copie impossible : utilisez « Enregistrer le fichier des notes ».', 'bad');

  // ====================================================================== VERSION EN LIGNE : mot de passe, verrou, sauvegardes
  function rendreVerrou() {
    fermerMenuCol();
    $('#onglets').innerHTML = ''; $('#btn-notes').hidden = true; $('#btn-verrou').hidden = true; majBadge();
    page.className = 'vue-verrou';
    const existe = !!enveloppeGardee();
    page.innerHTML = `<div class="verrou"><section class="card">
      <h2>Suivi des paiements</h2>
      ${existe ? `<p class="lead">Le livre est chiffré sur cet appareil. Entrez votre mot de passe pour l’ouvrir.</p>
        <form data-f="mdpOuvrir" novalidate class="champs-verrou"><input type="text" autocomplete="username" value="Suivi des paiements" hidden aria-hidden="true" tabindex="-1">
          <label for="mdp">Mot de passe</label><input type="password" id="mdp" autocomplete="current-password" autofocus>
          <p class="erreur" id="mdp-erreur" role="alert"></p>
          <button type="submit" class="btn pri">Ouvrir le livre</button></form>
        <details class="aide"><summary>Mot de passe oublié ?</summary>
          <p class="note">Il n’est gardé nulle part et ne peut pas être retrouvé. Deux possibilités : restaurer une sauvegarde (elle s’ouvre avec le mot de passe qu’avait le livre le jour de la sauvegarde), ou effacer le livre de cet appareil et repartir de zéro.</p>
          <div class="row"><label class="btn" for="ver-fichier">Restaurer une sauvegarde</label><input type="file" id="ver-fichier" accept=".json,application/json" hidden data-c="restaurerVerrou">${bt('Effacer le livre de cet appareil', 'livreEffacer', '', 'danger')}</div></details>`
      : `<p class="lead">Première ouverture sur cet appareil : choisissez un mot de passe. Il chiffre le livre sur l’appareil et n’est gardé nulle part.</p>
        <form data-f="mdpCreer" novalidate class="champs-verrou"><input type="text" autocomplete="username" value="Suivi des paiements" hidden aria-hidden="true" tabindex="-1">
          <label for="mdp1">Mot de passe (au moins ${N.MDP_MIN} caractères)</label><input type="password" id="mdp1" autocomplete="new-password" autofocus>
          <label for="mdp2">Le même, une seconde fois</label><input type="password" id="mdp2" autocomplete="new-password">
          <label class="coche"><input type="checkbox" id="mdp-compris"><span class="txt">J’ai compris : sans ce mot de passe, le livre ne peut plus être ouvert. Je le note en lieu sûr et je fais des sauvegardes.</span></label>
          <p class="erreur" id="mdp-erreur" role="alert"></p>
          <button type="submit" class="btn pri">Créer le livre</button></form>
        <p class="note">Le livre vient d’un autre appareil ? <label class="lien-btn" for="ver-fichier">Restaurer une sauvegarde</label><input type="file" id="ver-fichier" accept=".json,application/json" hidden data-c="restaurerVerrou"> : le livre gardera le mot de passe de la sauvegarde.</p>`}
    </section></div>`;
  }
  function ouvrirLivre(o, c) {
    etat = o; cle = c; verrouille = false; prevenu = false;
    const j = auj(); F.jour = j; F.mois = F.synMois = j.slice(0, 7);
    derniereActivite = Date.now();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (x) { /* demande facultative */ }
    vue = lire(location.hash.slice(1)); rendre(); window.scrollTo(0, 0);
  }
  function verrouiller(pourquoi) {
    if (!PROD || verrouille) return;
    fermer(); etat = null; cle = null; verrouille = true; rendre();
    if (pourquoi) toast(pourquoi);
  }
  const occupe = (f, oui) => { const b = $('button[type=submit]', f); if (b) { b.disabled = oui; if (oui) { b.dataset.txt = b.textContent; b.textContent = 'Un instant…'; } else if (b.dataset.txt) b.textContent = b.dataset.txt; } };
  FORMS.mdpOuvrir = async f => {
    const env = enveloppeGardee();
    if (!env) return rendre();
    occupe(f, true);
    try {
      const r = await N.dechiffrer(env, $('#mdp').value), o = lireEtat(r.texte);
      if (!o) throw new Error('Le livre s’ouvre, mais cette version ne sait pas le relire. Rien n’a été modifié : prévenez Hugo.');
      ouvrirLivre(o, r.cle);
    } catch (x) { occupe(f, false); erreur(x.message, '#mdp-erreur'); const m = $('#mdp'); if (m) { m.select(); m.focus(); } }
  };
  FORMS.mdpCreer = async f => {
    const a = $('#mdp1').value, b = $('#mdp2').value;
    try {
      N.mdpValide(a);
      if (a !== b) throw new Error('Les deux mots de passe ne sont pas identiques.');
      if (!$('#mdp-compris').checked) throw new Error('Cochez la case pour confirmer que vous avez compris.');
    } catch (x) { return erreur(x.message, '#mdp-erreur'); }
    occupe(f, true);
    try {
      const c = await N.nouvelleCle(a), e = N.reglagesCabinet(N.etatVide());
      ouvrirLivre(e, c); persister();
      toast('Livre créé et chiffré sur cet appareil. Pensez à faire une première sauvegarde après quelques saisies.');
    } catch (x) { occupe(f, false); erreur(x.message, '#mdp-erreur'); }
  };
  // Demande le mot de passe d'un fichier (sauvegarde), dans une fenêtre ; fn(mdp) rend une promesse, son erreur s'affiche dans la fenêtre.
  function demanderMdp(titre, texte, fn) {
    ouvrir(`<h3>${h(titre)}</h3><p>${h(texte)}</p><form data-f="mdpFenetre" novalidate><div class="champs-verrou"><input type="text" autocomplete="username" value="Suivi des paiements" hidden aria-hidden="true" tabindex="-1"><label for="mdp-f">Mot de passe</label><input type="password" id="mdp-f" autocomplete="current-password" autofocus></div>
      <p class="erreur" id="dlg-erreur" role="alert"></p><div class="row fin"><button type="button" class="btn" data-a="fermer">Annuler</button><button type="submit" class="btn pri">Valider</button></div></form>`);
    F.mdpFn = fn;
  }
  FORMS.mdpFenetre = async f => {
    occupe(f, true);
    try { await F.mdpFn($('#mdp-f', dlg).value); } catch (x) { occupe(f, false); erreur(x.message); const m = $('#mdp-f', dlg); if (m) { m.select(); m.focus(); } }
  };
  // Restaurer : depuis l'écran verrouillé (le livre prend le mot de passe de la sauvegarde) ou depuis les paramètres (il garde le mot de passe actuel).
  function restaurerProd(texte, depuisVerrou) {
    let o = null;
    try { o = JSON.parse(texte); } catch (x) { o = null; }
    if (!N.estEnveloppe(o)) {
      const clair = o && N.relire(o);
      if (!clair || depuisVerrou) return toast('Ce fichier n’est pas une sauvegarde chiffrée de cet outil : rien n’a été modifié.', 'bad');
      return confirmer('Restaurer cette sauvegarde non chiffrée ?', 'Elle remplacera tout le livre (' + pluriel(clair.lignes.length, 'ligne', 'lignes') + '). Elle sera chiffrée ici avec le mot de passe actuel.', 'Restaurer', () => { etat = clair; persister(); return true; }, { danger: true });
    }
    demanderMdp('Ouvrir la sauvegarde', 'Mot de passe que le livre avait le jour de cette sauvegarde.', async mdp => {
      const r = await N.dechiffrer(o, mdp), livre = lireEtat(r.texte);
      if (!livre) throw new Error('La sauvegarde s’ouvre, mais cette version ne sait pas la relire.');
      if (depuisVerrou) { fermer(); ouvrirLivre(livre, r.cle); persister(); toast('Sauvegarde restaurée : ' + pluriel(livre.lignes.length, 'ligne', 'lignes') + '. Le livre garde le mot de passe de la sauvegarde.'); return; }
      confirmer('Restaurer cette sauvegarde ?', 'Elle remplacera tout le livre affiché. Elle contient ' + pluriel(livre.lignes.length, 'ligne', 'lignes') + ' et ' + pluriel(livre.patients.length, 'patient', 'patients') + '. Le mot de passe actuel est gardé.', 'Restaurer', () => { etat = livre; persister(); return true; }, { danger: true, apres: () => toast('Sauvegarde restaurée.') });
    });
  }
  CHANGES.restaurerVerrou = el => {
    const f = el.files && el.files[0]; if (!f) return;
    const l = new FileReader();
    l.onload = () => { el.value = ''; restaurerProd(String(l.result), true); };
    l.onerror = () => toast('Le fichier n’a pas pu être lu.', 'bad');
    l.readAsText(f);
  };
  ACTIONS.livreEffacer = () => confirmer('Effacer le livre de cet appareil ?', 'Sans le mot de passe, le livre chiffré est perdu. Seules les sauvegardes permettront de le retrouver. Les notes d’amélioration sont gardées.', 'Effacer le livre', () => {
    try { localStorage.removeItem(CLE); localStorage.removeItem(CLE_SAUVE); } catch (x) { /* rien à effacer */ }
    return true;
  }, { danger: true, apres: () => toast('Livre effacé de cet appareil. Choisissez un mot de passe pour en créer un nouveau.') });
  ACTIONS.verrouiller = () => verrouiller('Livre verrouillé.');
  ACTIONS.mdpChanger = () => {
    ouvrir(`<h3>Changer le mot de passe</h3><form data-f="mdpChanger" novalidate><div class="champs-verrou"><input type="text" autocomplete="username" value="Suivi des paiements" hidden aria-hidden="true" tabindex="-1">
      <label for="mdp-ancien">Mot de passe actuel</label><input type="password" id="mdp-ancien" autocomplete="current-password" autofocus>
      <label for="mdp-n1">Nouveau mot de passe (au moins ${N.MDP_MIN} caractères)</label><input type="password" id="mdp-n1" autocomplete="new-password">
      <label for="mdp-n2">Le nouveau, une seconde fois</label><input type="password" id="mdp-n2" autocomplete="new-password"></div>
      <p class="note">Les sauvegardes déjà faites gardent l’ancien mot de passe. Faites une nouvelle sauvegarde ensuite.</p>
      <p class="erreur" id="dlg-erreur" role="alert"></p><div class="row fin"><button type="button" class="btn" data-a="fermer">Annuler</button><button type="submit" class="btn pri">Changer</button></div></form>`);
  };
  FORMS.mdpChanger = async f => {
    const a = $('#mdp-n1', dlg).value, b = $('#mdp-n2', dlg).value;
    try { N.mdpValide(a); if (a !== b) throw new Error('Les deux nouveaux mots de passe ne sont pas identiques.'); } catch (x) { return erreur(x.message); }
    occupe(f, true);
    try {
      await ecritures;
      await N.dechiffrer(enveloppeGardee(), $('#mdp-ancien', dlg).value);   // vérifie l'actuel
      cle = await N.nouvelleCle(a); persister(); await ecritures;
      fermer(); toast('Mot de passe changé. Faites une nouvelle sauvegarde : les anciennes gardent l’ancien mot de passe.');
    } catch (x) { occupe(f, false); erreur(x.message === 'Mot de passe incorrect.' ? 'Le mot de passe actuel est incorrect.' : x.message); }
  };
  function htmlRappelSauvegarde() {
    const d = derniereSauvegarde(), j = d ? N.ecartJours(d, auj()) : null;
    if (!etat.lignes.length || (d && j < JOURS_SANS_SAUVEGARDE)) return '';
    return `<div class="rappel sauve" role="status"><span class="txt"><b>${d ? 'Dernière sauvegarde il y a ' + pluriel(j, 'jour', 'jours') + '.' : 'Aucune sauvegarde pour l’instant.'}</b> Le livre n’existe que sur cet appareil : une sauvegarde chiffrée le protège d’une perte ou d’une panne.</span>
      <span class="row">${bt('Faire une sauvegarde', 'sauvegarde', '', 'pri')}</span></div>`;
  }
  function htmlDonneesProd() {
    const d = derniereSauvegarde();
    return `<section class="card"><h3>Données et mot de passe</h3>
      <p class="note">Le livre est chiffré sur cet appareil avec votre mot de passe (AES 256 bits) ; rien ne part sur Internet. Il se verrouille seul après ${VERROU_ARRIERE_PLAN / 60000} minutes en arrière-plan ou ${VERROU_INACTIVITE / 60000} minutes sans utilisation.</p>
      <p class="note">Dernière sauvegarde : <b>${d ? h(N.dateFr(d)) : 'aucune'}</b>. Une sauvegarde est un fichier chiffré avec le mot de passe du moment : gardez-la dans Fichiers ou iCloud Drive, ou envoyez-la sur le Mac pour y ouvrir le livre.</p>
      <div class="row"><button type="button" class="btn pri" data-a="sauvegarde">Faire une sauvegarde</button>
        <label class="btn" for="reg-fichier">Restaurer une sauvegarde</label><input type="file" id="reg-fichier" accept=".json,application/json" hidden data-c="restaurer">
        <button type="button" class="btn" data-a="mdpChanger">Changer le mot de passe</button>
        <button type="button" class="btn danger" data-a="vider">Vider le livre</button></div></section>`;
  }
  // Verrou automatique : après un moment en arrière-plan, ou sans utilisation.
  ['pointerdown', 'keydown', 'input'].forEach(t => document.addEventListener(t, () => { derniereActivite = Date.now(); }, true));
  document.addEventListener('visibilitychange', () => {
    if (!PROD) return;
    if (document.hidden) cacheLe = Date.now();
    else if (!verrouille && cacheLe && Date.now() - cacheLe > VERROU_ARRIERE_PLAN) verrouiller('Livre verrouillé après un moment en arrière-plan.');
  });
  if (PROD) setInterval(() => { if (!verrouille && Date.now() - derniereActivite > VERROU_INACTIVITE) verrouiller('Livre verrouillé après ' + VERROU_INACTIVITE / 60000 + ' minutes sans utilisation.'); }, 30000);

  // ====================================================================== événements
  ACTIONS.aller = el => aller(el.dataset.vue);
  ACTIONS.fermer = () => fermer();
  ACTIONS.oui = () => { const s = suite; if (!s || !s.fn()) return; fermer(); rendre(); if (s.apres) s.apres(); };
  ACTIONS.non = () => { const s = suite; fermer(); if (s && s.retour) s.retour(); };

  const horsFenetre = ev => { const b = dlg.getBoundingClientRect(); return ev.clientX < b.left || ev.clientX > b.right || ev.clientY < b.top || ev.clientY > b.bottom; };
  document.addEventListener('mousedown', ev => { fondAppuye = ev.target === dlg && horsFenetre(ev); });
  document.addEventListener('click', ev => {
    if (ev.target === dlg) {   // le fond assombri ferme la fenêtre, mais seulement si le clic y a commencé (pas en fin de sélection d'un texte)
      if (fondAppuye && horsFenetre(ev)) ACTIONS.non();
      return;
    }
    const el = ev.target.closest('[data-a]');
    if (!el || el.disabled) return;
    if (el.tagName === 'A' && !('suivre' in el.dataset)) ev.preventDefault();   // « suivre » : le lien s'ouvre en plus de l'action
    const fn = ACTIONS[el.dataset.a];
    if (fn) fn(el, ev);
  });
  document.addEventListener('keydown', ev => { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('rect[data-a]')) { ev.preventDefault(); ACTIONS[ev.target.dataset.a](ev.target); } });
  document.addEventListener('change', ev => { const el = ev.target.closest('[data-c]'); if (el && CHANGES[el.dataset.c]) CHANGES[el.dataset.c](el); });
  document.addEventListener('input', ev => { const el = ev.target.closest('[data-saisie]'); if (el && SAISIES[el.dataset.saisie]) SAISIES[el.dataset.saisie](el); });
  document.addEventListener('submit', ev => { ev.preventDefault(); const f = ev.target.closest('[data-f]'); if (f && FORMS[f.dataset.f]) FORMS[f.dataset.f](f); });
  document.addEventListener('toggle', ev => { const d = ev.target; if (d && d.tagName === 'DETAILS' && d.id) F.ouverts[d.id] = d.open; }, true);
  // Échap sur une confirmation : comme « Annuler », on revient à la fenêtre d'où l'on venait.
  dlg.addEventListener('close', () => {
    if (dlg.open) return;   // déjà rouverte par l'action qui vient de la fermer
    const s = suite;
    suite = null; dlg.innerHTML = '';
    if (s && s.retour) s.retour();
  });

  // bulle d'information des graphiques
  function montrerBulle(el, x, y) {
    bulle.textContent = el.dataset.tip; bulle.hidden = false;
    const b = bulle.getBoundingClientRect();
    bulle.style.left = Math.max(8, Math.min(x + 12, window.innerWidth - b.width - 8)) + 'px';
    bulle.style.top = Math.max(8, y - b.height - 12) + 'px';
  }
  document.addEventListener('mousemove', ev => { const el = ev.target.closest ? ev.target.closest('[data-tip]') : null; if (el) montrerBulle(el, ev.clientX, ev.clientY); else if (!bulle.hidden) bulle.hidden = true; });
  document.addEventListener('focusin', ev => { const el = ev.target.closest ? ev.target.closest('[data-tip]') : null; if (el) { const b = el.getBoundingClientRect(); montrerBulle(el, b.left + b.width / 2, b.top + 24); } });
  document.addEventListener('focusout', () => { bulle.hidden = true; });

  window.addEventListener('resize', () => { clearTimeout(redessin); redessin = setTimeout(dessiner, 120); });
  const reveil = () => { if (!document.hidden && !verrouille && auj() !== F.jour) rendre(); };
  document.addEventListener('visibilitychange', reveil);
  window.addEventListener('focus', reveil);
  window.addEventListener('hashchange', () => {
    const v = lire(location.hash.slice(1));
    if (v.nom === vue.nom && v.id === vue.id) return;
    vue = v; fermer(); if (!verrouille) rendre(); window.scrollTo(0, 0);
  });
  // Le livre modifié dans une autre fenêtre du même navigateur : on le recharge ici plutôt que de l'écraser au prochain clic.
  window.addEventListener('storage', ev => {
    if (ev.key === CLE_NOTES) { chargerNotes(); if (vue.nom === 'notes' && !dlg.open) rendre(); else majNotes(); return; }
    if (ev.key !== CLE || !ev.newValue) return;
    if (PROD) {
      if (verrouille) { if (!!$('#mdp1') === !enveloppeGardee()) return; return rendre(); }   // l'écran verrouillé change de mode si un livre vient d'être créé ou effacé ailleurs
      let env = null; try { env = JSON.parse(ev.newValue); } catch (x) { return; }
      N.dechiffrerAvec(cle, env).then(t => { const o = lireEtat(t); if (o) { etat = o; fermer(); rendre(); toast('Le livre a été modifié dans une autre fenêtre : il est rechargé ici.'); } })
        .catch(() => verrouiller('Le mot de passe a changé dans une autre fenêtre : entrez le nouveau.'));
      return;
    }
    const o = lireEtat(ev.newValue);
    if (!o) return;
    etat = o; fermer(); rendre();
    toast('Le livre a été modifié dans une autre fenêtre : il est rechargé ici.');
  });

  // ---------- démarrage ----------
  const j0 = auj();
  chargerNotes();
  if (PROD) {
    F.jour = j0; F.mois = F.synMois = j0.slice(0, 7);
    rendre();
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {   // hors ligne et mises à jour
      const avait = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js').catch(() => {});
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!avait) return;
        const b = $('#maj'); b.hidden = false;
      });
    }
    return;
  }
  etat = charger();
  if (!etat || (etat.demo && !etat.demo.modifie && etat.demo.genereLe !== j0)) { etat = N.donneesDemo(j0); sauver(); }
  F.jour = j0; F.mois = F.synMois = j0.slice(0, 7);
  vue = lire(location.hash.slice(1));
  rendre();
  if (ecarte) toast('Les données enregistrées n’ont pas pu être relues : elles sont mises de côté (Paramètres, Données) et le jeu d’exemple est affiché.', 'bad');
})();
</script>
